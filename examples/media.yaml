basePath: /v1
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Serviço responsável por realizar o download de arquivos de mídia.
  title: Vision Media API
  version: 0.1.0
paths:
  /medias/files:
    get:
      description: Permite baixar um arquivo identificado por uma chave criptografada.
        Suporta redimensionamento de imagens com os parâmetros width e height.
      parameters:
      - description: Chave para identificar o arquivo
        in: query
        name: key
        required: true
        type: string
      - description: Se 1, força o download
        in: query
        name: download
        type: string
      - description: Nome personalizado do arquivo para download
        in: query
        name: filename
        type: string
      - description: Largura da miniatura da imagem (apenas para imagens)
        in: query
        name: width
        type: integer
      - description: Altura da miniatura da imagem (apenas para imagens)
        in: query
        name: height
        type: integer
      - description: Cabeçalho Range para solicitar conteúdo parcial
        in: header
        name: Range
        type: string
      responses:
        "200":
          description: Arquivo servido com sucesso
          schema:
            type: file
        "206":
          description: Conteúdo parcial servido
          schema:
            type: file
        "404":
          description: Arquivo não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      operationId: baixar-arquivo-com-chave-segura
      summary: Baixar arquivo com chave segura
      tags:
      - Media-API
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"

