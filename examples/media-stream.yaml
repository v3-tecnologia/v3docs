basePath: /v1
definitions:
  response.SegmentStatus:
    properties:
      app:
        description: Nome da aplicação
        type: string
      file_count:
        description: Número de arquivos de segmento na transmissão
        type: integer
      newest_file:
        description: Data/hora do arquivo de segmento mais recente
        type: string
      oldest_file:
        description: Data/hora do arquivo de segmento mais antigo
        type: string
      path:
        description: Caminho do diretório da transmissão
        type: string
      size_mb:
        description: Tamanho total de todos os segmentos em megabytes
        type: number
      stream_key:
        description: Identificador da chave da transmissão
        type: string
    type: object
  response.CleanupConfig:
    properties:
      cleanup_interval_seconds:
        description: Intervalo em segundos entre operações de limpeza
        type: integer
      max_age_minutes:
        description: Idade máxima em minutos dos segmentos antes da exclusão
        type: integer
      max_segments_per_stream:
        description: Número máximo de segmentos permitidos por transmissão
        type: integer
    type: object
  response.SegmentsStatusResponse:
    properties:
      cleanup_config:
        $ref: '#/definitions/response.CleanupConfig'
        description: Configuração atual de limpeza
      streams:
        description: Lista de todas as transmissões ativas com informações de segmentos
        items:
          $ref: '#/definitions/response.SegmentStatus'
        type: array
      total_files:
        description: Número total de arquivos de segmento em todas as transmissões
        type: integer
      total_size_mb:
        description: Tamanho total de todos os segmentos em megabytes
        type: number
    type: object
  response.CleanupResponse:
    properties:
      message:
        description: Mensagem de resposta
        type: string
      status:
        description: Status da operação de limpeza
        type: string
    type: object
  types.ValidationError:
    properties:
      code:
        description: Código do erro
        type: string
      detail:
        description: Descrição legível do erro
        type: string
      source:
        allOf:
        - $ref: '#/definitions/types.Source'
        description: Origem do erro
      status:
        description: Código de status HTTP
        type: integer
      title:
        description: Título legível do erro
        type: string
    type: object
  types.Source:
    properties:
      pointer:
        type: string
    type: object
host: tenant.v3sandbox.com
paths:
  /video/{app}/{stream_key}/{filename}:
    get:
      consumes:
      - application/json
      description: |-
        Permite baixar arquivos de segmento HLS (M3U8, TS) identificados pelo caminho.
        Suporta requisições de conteúdo parcial por meio do cabeçalho Range.
      parameters:
      - description: Identificador da aplicação
        in: path
        name: app
        required: true
        type: string
      - description: Identificador da chave da transmissão
        in: path
        name: stream_key
        required: true
        type: string
      - description: "Nome do arquivo do segmento (ex.: manifest.m3u8, segment-123.ts)"
        in: path
        name: filename
        required: true
        type: string
      - description: "Cabeçalho Range para solicitar conteúdo parcial (ex.: bytes=0-1023)"
        in: header
        name: Range
        type: string
      produces:
      - application/vnd.apple.mpegurl
      - video/mp2t
      responses:
        "200":
          description: Arquivo de segmento servido com sucesso
          schema:
            type: file
        "206":
          description: Conteúdo parcial servido com sucesso
          schema:
            type: file
        "404":
          description: Arquivo da transmissão não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      operationId: baixar-segmento-ou-manifesto-hls
      summary: Baixar segmento ou manifesto HLS
      tags:
      - Media-Stream
  /streams:
    get:
      consumes:
      - application/json
      description: Recupera a lista de todas as transmissões HLS ativas com status
        e metadados atuais.
      produces:
      - application/json
      responses:
        "200":
          description: Lista de transmissões ativas recuperada com sucesso
          schema:
            items:
              properties:
                app:
                  type: string
                  description: Identificador da aplicação
                created_at:
                  type: string
                  description: Data/hora de criação da transmissão
                stream_key:
                  type: string
                  description: Identificador da chave da transmissão
                status:
                  type: string
                  description: Status atual da transmissão (active, inactive, etc.)
            type: array
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
      security:
      - OAuth2: [read:streams]
      operationId: listar-transmissoes-ativas
      summary: Listar transmissões ativas
      tags:
      - Media-Stream
  /stream/{app}/{stream_key}:
    get:
      consumes:
      - application/json
      description: |-
        Recupera a página HTML do player para uma transmissão HLS específica.
        A transmissão deve estar ativa e disponível no registro.
      parameters:
      - description: Identificador da aplicação
        in: path
        name: app
        required: true
        type: string
      - description: Identificador da chave da transmissão
        in: path
        name: stream_key
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Página do player da transmissão renderizada com sucesso
          schema:
            type: string
        "302":
          description: Transmissão não encontrada ou inativa, redirecionamento para a página inicial
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
      security:
      - OAuth2: [read:streams]
      operationId: obter-pagina-do-player-de-transmissao
      summary: Obter página do player de transmissão
      tags:
      - Media-Stream
schemes:
- https
securityDefinitions:
  OAuth2:
    authorizationUrl: https://auth.v3sandbox.com/oauth/authorize
    flow: implicit
    scopes:
      read:streams: Acesso de leitura às transmissões
      write:streams: Acesso de escrita às transmissões
      read:admin: Acesso de leitura aos endpoints administrativos
      write:admin: Acesso de escrita aos endpoints administrativos
    type: oauth2
swagger: "2.0"

