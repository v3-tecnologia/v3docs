{
    "schemes": [
        "https"
    ],
    "swagger": "2.0",
    "info": {
        "description": "Aplicação em GO responsável por realizar a gestão de ordens para os dispositivos.",
        "title": "Orders API",
        "contact": {},
        "version": "0.0.1"
    },
    "host": "tenant.v3sandbox.com",
    "basePath": "/v1",
    "paths": {
        "/devices/{device_id}/orders": {
            "get": {
                "description": "Retrieve a list of orders with optional filtering by device_id and correlation_id. Supports pagination.",
                "consumes": [
                    "application/json"
                ],
                "produces": [
                    "application/json"
                ],
                "tags": [
                    "Order"
                ],
                "summary": "Find orders with optional filtering",
                "parameters": [
                    {
                        "type": "string",
                        "description": "Device ID",
                        "name": "device_id",
                        "in": "path",
                        "required": true
                    },
                    {
                        "type": "integer",
                        "description": "Page number (default: 1)",
                        "name": "page",
                        "in": "query"
                    },
                    {
                        "type": "integer",
                        "description": "Page size (default: 10, max: 100)",
                        "name": "page_size",
                        "in": "query"
                    },
                    {
                        "type": "string",
                        "description": "Filter by correlation ID",
                        "name": "correlation_id",
                        "in": "query"
                    }
                ],
                "responses": {
                    "200": {
                        "description": "Orders retrieved successfully",
                        "schema": {
                            "type": "array",
                            "items": {
                                "$ref": "#/definitions/mapper.OrderResponse"
                            }
                        }
                    },
                    "400": {
                        "description": "Invalid request payload",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "401": {
                        "description": "Unauthorized",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    }
                }
            }
        },
        "/v1/devices/{device_id}/orders": {
            "post": {
                "security": [
                    {
                        "ApiKeyAuth": []
                    }
                ],
                "description": "Submits a list of commands to be executed by the specified device.\nEach command in the list can be one of several supported types, such as:\n(**AddWifi**, **DeleteWifi**, **DeviceState**, **RequestImage**, **RequestVideo**, **Reboot**,\n**Periodic**, **VisionConfig**, **DataPlanConfig**).",
                "consumes": [
                    "application/json"
                ],
                "produces": [
                    "application/json"
                ],
                "tags": [
                    "Order"
                ],
                "summary": "Create new order",
                "parameters": [
                    {
                        "type": "string",
                        "description": "ULID do Device",
                        "name": "device_id",
                        "in": "path",
                        "required": true
                    },
                    {
                        "description": "Create Order payload",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.CreateOrderDTO"
                        }
                    },
                    {
                        "description": "Order",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.OrderDTO"
                        }
                    },
                    {
                        "description": "Add Wifi",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.AddWifiDTO"
                        }
                    },
                    {
                        "description": "Delete Wifi",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.DeleteWifiDTO"
                        }
                    },
                    {
                        "description": "Device State",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.DeviceStateDTO"
                        }
                    },
                    {
                        "description": "Request Image",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.RequestImageDTO"
                        }
                    },
                    {
                        "description": "Request Video",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.RequestVideoDTO"
                        }
                    },
                    {
                        "description": "Reboot",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.RebootDTO"
                        }
                    },
                    {
                        "description": "Periodic",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.PeriodicDTO"
                        }
                    },
                    {
                        "description": "Vision Config",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.VisionConfigDTO"
                        }
                    },
                    {
                        "description": "Data Plan Config",
                        "name": "payload",
                        "in": "body",
                        "required": true,
                        "schema": {
                            "$ref": "#/definitions/dto.DataPlanConfigDTO"
                        }
                    }
                ],
                "responses": {
                    "202": {
                        "description": "Order sended to created",
                        "schema": {
                            "$ref": "#/definitions/mapper.OrderSuccessAccepted"
                        }
                    },
                    "400": {
                        "description": "Invalid request payload",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "401": {
                        "description": "Unauthorized",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "500": {
                        "description": "Internal server error",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    }
                }
            },
            "delete": {
                "description": "Deletes multiple orders for a specific device.\nIf the `ids` query parameter is provided, only the specified orders will be deleted.\nIf omitted, all orders associated with the device may be removed (depending on implementation rules).",
                "consumes": [
                    "application/json"
                ],
                "produces": [
                    "application/json"
                ],
                "tags": [
                    "Order"
                ],
                "summary": "Delete multiple orders",
                "parameters": [
                    {
                        "type": "string",
                        "description": "Unique identifier of the device",
                        "name": "device_id",
                        "in": "path",
                        "required": true
                    },
                    {
                        "type": "string",
                        "description": "Comma-separated list of order IDs to delete **(e.g. id1,id2,id3)**",
                        "name": "ids",
                        "in": "query"
                    }
                ],
                "responses": {
                    "202": {
                        "description": "Order sended to deleted",
                        "schema": {
                            "$ref": "#/definitions/mapper.OrderSuccessAccepted"
                        }
                    },
                    "400": {
                        "description": "Invalid request payload",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "401": {
                        "description": "Unauthorized",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "500": {
                        "description": "Internal server error",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    }
                }
            }
        },
        "/v1/devices/{device_id}/orders/{id}": {
            "get": {
                "description": "Retrieve an order by its ID for a specific device",
                "consumes": [
                    "application/json"
                ],
                "produces": [
                    "application/json"
                ],
                "tags": [
                    "Order"
                ],
                "summary": "Get a specific order",
                "parameters": [
                    {
                        "type": "string",
                        "description": "Device ID",
                        "name": "device_id",
                        "in": "path",
                        "required": true
                    },
                    {
                        "type": "string",
                        "description": "Order ID",
                        "name": "id",
                        "in": "path",
                        "required": true
                    }
                ],
                "responses": {
                    "200": {
                        "description": "Order retrieved successfully",
                        "schema": {
                            "$ref": "#/definitions/mapper.OrderResponse"
                        }
                    },
                    "400": {
                        "description": "Invalid request payload",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "401": {
                        "description": "Unauthorized",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "404": {
                        "description": "Order not found",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    }
                }
            },
            "delete": {
                "description": "Deletes a single order identified by its ID for a given device.\nThis operation is irreversible and will permanently remove the order.",
                "consumes": [
                    "application/json"
                ],
                "produces": [
                    "application/json"
                ],
                "tags": [
                    "Order"
                ],
                "summary": "Delete a specific order",
                "parameters": [
                    {
                        "type": "string",
                        "description": "Device ID",
                        "name": "device_id",
                        "in": "path",
                        "required": true
                    },
                    {
                        "type": "string",
                        "description": "Order ID",
                        "name": "id",
                        "in": "path",
                        "required": true
                    }
                ],
                "responses": {
                    "202": {
                        "description": "Order sended to deleted",
                        "schema": {
                            "$ref": "#/definitions/mapper.OrderSuccessAccepted"
                        }
                    },
                    "400": {
                        "description": "Invalid request payload",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "401": {
                        "description": "Unauthorized",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    },
                    "500": {
                        "description": "Internal server error",
                        "schema": {
                            "$ref": "#/definitions/types.ValidationError"
                        }
                    }
                }
            }
        }
    },
    "definitions": {
        "dto.AddWifiDTO": {
            "type": "object",
            "properties": {
                "password": {
                    "description": "Password of the Wifi network",
                    "type": "string"
                },
                "ssid": {
                    "description": "SSID of the WiFi network",
                    "type": "string"
                }
            }
        },
        "dto.CreateOrderDTO": {
            "type": "object",
            "required": [
                "orders"
            ],
            "properties": {
                "orders": {
                    "description": "Orders is an array of individual order requests to be created.\nEach order in the array will be processed independently.",
                    "type": "array",
                    "items": {
                        "$ref": "#/definitions/dto.OrderDTO"
                    }
                }
            }
        },
        "dto.DataPlanConfigDTO": {
            "type": "object",
            "properties": {
                "block_reason": {
                    "description": "Reason for blocking the data plan. Required if IsBlocked is true, must be empty if IsBlocked is false.",
                    "type": "string"
                },
                "cycle_day": {
                    "description": "Cycle day of the month when the data plan resets (1-31). Optional, defaults to 0 (no cycle).",
                    "type": "integer"
                },
                "is_blocked": {
                    "description": "Indicates whether the data plan is currently blocked. Optional, defaults to false.",
                    "type": "boolean"
                },
                "total_mb": {
                    "description": "Total data plan in megabytes to be applied to the device",
                    "type": "integer"
                }
            }
        },
        "dto.DeleteWifiDTO": {
            "type": "object",
            "properties": {
                "ssid": {
                    "description": "SSID of the WiFi network to delete",
                    "type": "string"
                }
            }
        },
        "dto.DeviceStateDTO": {
            "type": "object"
        },
        "dto.OrderDTO": {
            "type": "object",
            "required": [
                "parameters",
                "type"
            ],
            "properties": {
                "correlation_id": {
                    "description": "CorrelationID is an optional unique identifier for request tracking.\nIf not provided, it will be auto-generated.",
                    "type": "string",
                    "maxLength": 50,
                    "minLength": 3
                },
                "parameters": {
                    "description": "Parameters contains the specific data needed for the order type.\nThe structure of each parameter depends on the order type.\nFor example, ADD_WIFI parameters would contain ssid and password...",
                    "type": "array",
                    "items": {
                        "type": "array",
                        "items": {
                            "type": "integer"
                        }
                    }
                },
                "type": {
                    "description": "Type specifies the kind of order being requested.",
                    "allOf": [
                        {
                            "$ref": "#/definitions/model.OrderType"
                        }
                    ]
                }
            }
        },
        "dto.PeriodicDTO": {
            "type": "object",
            "properties": {
                "off_message_periodic_seconds": {
                    "description": "Turns off periodic messages for **seconds**",
                    "type": "integer"
                },
                "on_message_first_seconds": {
                    "description": "Sends the first message after **seconds**",
                    "type": "integer"
                },
                "on_message_period_seconds": {
                    "description": "Sends messages every **seconds**",
                    "type": "integer"
                }
            }
        },
        "dto.RebootDTO": {
            "type": "object"
        },
        "dto.RequestImageDTO": {
            "type": "object",
            "required": [
                "cam"
            ],
            "properties": {
                "cam": {
                    "description": "Camera to be used for image capture **Ex: (0 = DriverCam, 1 = RoadCam)**",
                    "type": "string"
                },
                "start": {
                    "description": "Start of the time range for image capture in **RFC3339 format Ex: \"2006-01-02T15:04:05Z07:00\"**",
                    "type": "string"
                }
            }
        },
        "dto.RequestVideoDTO": {
            "type": "object",
            "required": [
                "cam"
            ],
            "properties": {
                "cam": {
                    "description": "Camera to be used for video capture **Ex: (0 = DriverCam, 1 = RoadCam)**",
                    "type": "string"
                },
                "end": {
                    "description": "End of the time range for video capture in **RFC3339 format Ex: \"2006-01-02T15:04:05Z07:00\"**",
                    "type": "string"
                },
                "start": {
                    "description": "Start of the time range for video capture in **RFC3339 format Ex: \"2006-01-02T15:04:05Z07:00\"**",
                    "type": "string"
                }
            }
        },
        "dto.VisionConfigDTO": {
            "type": "object",
            "properties": {
                "active_face_detect": {
                    "description": "Enables or disables face detection",
                    "type": "boolean"
                }
            }
        },
        "mapper.OrderResponse": {
            "type": "object",
            "properties": {
                "correlationId": {
                    "type": "string"
                },
                "createdAt": {
                    "type": "string"
                },
                "deletedAt": {
                    "type": "string"
                },
                "deviceId": {
                    "type": "string"
                },
                "group": {
                    "type": "string"
                },
                "id": {
                    "type": "string"
                },
                "sourceCreatedAt": {
                    "type": "string"
                },
                "status": {
                    "type": "string"
                },
                "type": {
                    "type": "string"
                },
                "updatedAt": {
                    "type": "string"
                }
            }
        },
        "mapper.OrderSuccessAccepted": {
            "type": "object",
            "properties": {
                "orders": {
                    "type": "array",
                    "items": {
                        "$ref": "#/definitions/mapper.SuccessAccepted"
                    }
                }
            }
        },
        "mapper.SuccessAccepted": {
            "type": "object",
            "properties": {
                "correlation_id": {
                    "description": "CorrelationID of the order",
                    "type": "string"
                },
                "href": {
                    "description": "Href to the order resource avaiable to be accessed e.g. https://golfleet.v3sandbox.com/v1/devices/{device_id}/orders/{order_id}",
                    "type": "string"
                },
                "id": {
                    "description": "ID of the order",
                    "type": "string"
                },
                "status": {
                    "description": "Status of the order (PENDING, DELETED, FAILED, SENT, PROCESSEDED)",
                    "type": "string"
                }
            }
        },
        "model.OrderType": {
            "type": "string",
            "enum": [
                "ADD_WIFI",
                "DELETE_WIFI",
                "DEVICE_STATE",
                "REQUEST_IMAGE",
                "REQUEST_VIDEO",
                "CONFIG",
                "REBOOT",
                "INTERNAL",
                "VISION_CONFIG",
                "PERIODIC",
                "DATAPLAN_CONFIG"
            ],
            "x-enum-varnames": [
                "ADD_WIFI",
                "DELETE_WIFI",
                "DEVICE_STATE",
                "REQUEST_IMAGE",
                "REQUEST_VIDEO",
                "ORDER_CONFIG",
                "REBOOT",
                "INTERNAL",
                "VISION_CONFIG",
                "PERIODIC",
                "DATAPLAN_CONFIG"
            ]
        },
        "types.Source": {
            "type": "object",
            "properties": {
                "pointer": {
                    "type": "string"
                }
            }
        },
        "types.ValidationError": {
            "type": "object",
            "properties": {
                "code": {
                    "description": "Error code",
                    "type": "string"
                },
                "detail": {
                    "description": "Human-readable error description",
                    "type": "string"
                },
                "source": {
                    "description": "Source of the error, e.g. the field that caused the error",
                    "allOf": [
                        {
                            "$ref": "#/definitions/types.Source"
                        }
                    ]
                },
                "status": {
                    "description": "HTTP status code",
                    "type": "integer"
                },
                "title": {
                    "description": "Human-readable error title",
                    "type": "string"
                }
            }
        }
    },
    "securityDefinitions": {
        "ApiKeyAuth": {
            "type": "apiKey",
            "name": "Bearer Token",
            "in": "header"
        }
    }
}