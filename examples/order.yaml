basePath: /v1
definitions:
  dto.AddWifiDTO:
    properties:
      parameters:
        description: 'Array of WiFi configuration parameters **Example**: [{"ssid":
          "MyWifi", "password": "123456"}]'
        items:
          $ref: '#/definitions/model.AddWifi'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be **ADD_WIFI**)
    type: object
  dto.CreateOrderDTO:
    properties:
      orders:
        description: |-
          Orders is an array of individual order requests to be created.
          Each order in the array will be processed independently.
        items:
          $ref: '#/definitions/dto.OrderDTO'
        type: array
    required:
    - orders
    type: object
  dto.DeleteWifiDTO:
    properties:
      parameters:
        description: 'Array of WiFi deletion parameters **Example**: [{"ssid": "MyWifi"}]'
        items:
          $ref: '#/definitions/model.DeleteWifi'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be **DELETE_WIFI**)
    type: object
  dto.DeviceStateDTO:
    properties:
      parameters:
        description: 'Array of device state parameters **Example**: [{"active": true}]'
        items:
          $ref: '#/definitions/model.DeviceState'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be **DEVICE_STATE**)
    type: object
  dto.DriverInertialDTO:
    properties:
      parameters:
        description: 'Array of driver inertial parameters **Example**: [{"active":
          true}]'
        items:
          $ref: '#/definitions/model.DriverInertial'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be DRIVER_COACH_INERTIAL)
    type: object
  dto.DriverTelemetryDTO:
    properties:
      parameters:
        description: 'Array of driver telemetry parameters **Example**: [{"active":
          true}]'
        items:
          $ref: '#/definitions/model.DriverTelemetry'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be DRIVER_COACH_TELEMETRY)
    type: object
  dto.OrderDTO:
    properties:
      correlation_id:
        description: |-
          CorrelationID is an optional unique identifier for request tracking.
          If not provided, it will be auto-generated.
        maxLength: 50
        minLength: 3
        type: string
      parameters:
        description: |-
          Parameters contains the specific data needed for the order type.
          The structure of each parameter depends on the order type.
          For example, ADD_WIFI parameters would contain ssid and password...
        items:
          oneOf:
            - $ref: '#/definitions/model.AddWifi'
              title: AddWifi
            - $ref: '#/definitions/model.DeleteWifi'
              title: DeleteWifi
            - $ref: '#/definitions/model.DeviceState'
              title: DeviceState
            - $ref: '#/definitions/model.RequestImage'
              title: RequestImage
            - $ref: '#/definitions/model.RequestVideo'
              title: RequestVideo
            - $ref: '#/definitions/model.Reboot'
              title: Reboot
            - $ref: '#/definitions/model.DriverInertial'
              title: DriverInertial
            - $ref: '#/definitions/model.DriverTelemetry'
              title: DriverTelemetry
            - $ref: '#/definitions/model.Tracking'
              title: Tracking
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type specifies the kind of order being requested.
    required:
    - parameters
    - type
    type: object
  dto.RebootDTO:
    properties:
      parameters:
        description: 'Array of reboot parameters **Example**: [{"active": true}]'
        items:
          $ref: '#/definitions/model.Reboot'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be REBOOT)
    type: object
  dto.RequestImageDTO:
    properties:
      parameters:
        description: 'Array of image request parameters **Example**: [{"start": "2024-03-20T10:00:00Z",
          "cam": "1"}]'
        items:
          $ref: '#/definitions/model.RequestImage'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be REQUEST_IMAGE)
    type: object
  dto.RequestVideoDTO:
    properties:
      parameters:
        description: 'Array of video request parameters **Example**: [{"start": "2024-03-20T10:00:00Z",
          "end": "2024-03-20T11:00:00Z", "cam": "1"}]'
        items:
          $ref: '#/definitions/model.RequestVideo'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be REQUEST_VIDEO)
    type: object
  dto.TrackingDTO:
    properties:
      parameters:
        description: 'Array of tracking parameters **Example**: [{"active": true}]'
        items:
          $ref: '#/definitions/model.Tracking'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type of the order (it must be DRIVER_COACH_TRACKING)
    type: object
  mapper.OrderResponse:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      device_id:
        type: string
      group:
        type: string
      id:
        type: string
      source_created_at:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  model.AddWifi:
    properties:
      password:
        description: Password for the Wi-Fi network
        type: string
      ssid:
        description: SSID of the Wi-Fi network
        type: string
    type: object
  model.Cam:
    enum:
    - "1"
    - "0"
    type: string
    x-enum-varnames:
    - RoadCam
    - DriverCam
  model.DeleteWifi:
    properties:
      ssid:
        description: Indicates the SSID of the Wi-Fi network to be deleted
        type: string
    type: object
  model.DeviceState:
    type: object
  model.DriverInertial:
    properties:
      active:
        type: boolean
    type: object
  model.DriverTelemetry:
    properties:
      active:
        type: boolean
    type: object
  model.OrderType:
    enum:
    - ADD_WIFI
    - DELETE_WIFI
    - DEVICE_STATE
    - REQUEST_IMAGE
    - REQUEST_VIDEO
    - CONFIG
    - REBOOT
    - DRIVER_COACH_INERTIAL
    - DRIVER_COACH_TELEMETRY
    - DRIVER_COACH_TRACKING
    - INTERNAL
    type: string
    x-enum-varnames:
    - ADD_WIFI
    - DELETE_WIFI
    - DEVICE_STATE
    - REQUEST_IMAGE
    - REQUEST_VIDEO
    - ORDER_CONFIG
    - REBOOT
    - DRIVER_COACH_INERTIAL
    - DRIVER_COACH_TELEMETRY
    - DRIVER_COACH_TRACKING
    - INTERNAL
  model.Reboot:
    type: object
  model.RequestImage:
    properties:
      cam:
        $ref: '#/definitions/model.Cam'
      start:
        type: string
    required:
    - cam
    type: object
  model.RequestVideo:
    properties:
      cam:
        $ref: '#/definitions/model.Cam'
      end:
        type: string
      start:
        type: string
    required:
    - cam
    type: object
  model.Tracking:
    properties:
      active:
        type: boolean
    type: object
  types.OrdersSuccessResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/types.SuccessAccepted'
        type: array
    type: object
  types.Source:
    properties:
      pointer:
        type: string
    type: object
  types.SuccessAccepted:
    properties:
      href:
        description: Href to the order resource avaiable to be accessed e.g. https://golfleet.v3sandbox.com/v1/devices/{device_id}/orders/{order_id}
        type: string
      id:
        description: ID of the order
        type: string
      status:
        description: Status of the order (PENDING, DELETED, FAILED, SENT, PROCESSEDED)
        type: string
    type: object
  types.ValidationError:
    properties:
      code:
        description: Error code
        type: string
      detail:
        description: Human-readable error description
        type: string
      source:
        allOf:
        - $ref: '#/definitions/types.Source'
        description: Source of the error, e.g. the field that caused the error
      status:
        description: HTTP status code
        type: integer
      title:
        description: Human-readable error title
        type: string
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Aplicação em GO responsável por realizar a gestão de ordens para os
    dispositivos.
  title: Orders API
  version: 0.0.1
paths:
  /devices/{device_id}/orders:
    get:
      consumes:
      - application/json
      description: Retrieve a list of orders with optional filtering by device_id
        and correlation_id. Supports pagination.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filter by correlation ID
        in: query
        name: correlation_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Orders retrieved successfully
          schema:
            items:
              $ref: '#/definitions/mapper.OrderResponse'
            type: array
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Find orders with optional filtering
      tags:
      - Order
  /v1/devices/{device_id}/orders:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes multiple orders for a specific device.
        If the `ids` query parameter is provided, only the specified orders will be deleted.
        If omitted, all orders associated with the device may be removed (depending on implementation rules).
      parameters:
      - description: Unique identifier of the device
        in: path
        name: device_id
        required: true
        type: string
      - description: Comma-separated list of order IDs to delete **(e.g. id1,id2,id3)**
        in: query
        name: ids
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Order sended to deleted
          schema:
            items:
              $ref: '#/definitions/types.OrdersSuccessResponse'
            type: array
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Delete multiple orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: |-
        Submits a list of commands to be executed by the specified device.
        Each command in the list can be one of several supported types, such as:
        (**AddWifi**, **DeleteWifi**, **GetDeviceState**, **RequestImage**, **RequestVideo**, **Reboot**,
        **DriverCoachInertial**, **DriverCoachTelemetry**, **DriverCoachTracking**).
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Create Order payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderDTO'
      - description: Order
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.OrderDTO'
      - description: Add Wifi
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.AddWifiDTO'
      - description: Delete Wifi
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteWifiDTO'
      - description: Device State
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DeviceStateDTO'
      - description: Request Image
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RequestImageDTO'
      - description: Request Video
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RequestVideoDTO'
      - description: Reboot
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RebootDTO'
      - description: Driver Coach Inertial
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DriverInertialDTO'
      - description: Driver Coach Telemetry
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DriverTelemetryDTO'
      - description: Driver Coach Tracking
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.TrackingDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Order sended to created
          schema:
            $ref: '#/definitions/types.OrdersSuccessResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.ValidationError'
      security:
      - ApiKeyAuth: []
      summary: Create new order
      tags:
      - Order
  /v1/devices/{device_id}/orders/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes a single order identified by its ID for a given device.
        This operation is irreversible and will permanently remove the order.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Order sended to deleted
          schema:
            items:
              $ref: '#/definitions/types.OrdersSuccessResponse'
            type: array
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Delete a specific order
      tags:
      - Order
    get:
      consumes:
      - application/json
      description: Retrieve an order by its ID for a specific device
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order retrieved successfully
          schema:
            $ref: '#/definitions/mapper.OrderResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Get a specific order
      tags:
      - Order
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"
