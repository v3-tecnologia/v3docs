basePath: /v1
definitions:
  dto.AddWifiDTO:
    properties:
      password:
        description: Password of the Wifi network
        type: string
      ssid:
        description: SSID of the WiFi network
        type: string
    type: object
  dto.CloseStreamDTO:
    properties:
      cam:
        type: string
    required:
    - cam
    type: object
  dto.CreateOrderDTO:
    properties:
      orders:
        description: |-
          Orders is an array of individual order requests to be created.
          Each order in the array will be processed independently.
        items:
          $ref: '#/definitions/dto.OrderDTO'
        type: array
    required:
    - orders
    type: object
  dto.DataPlanConfigDTO:
    properties:
      block_reason:
        description: Reason for blocking the data plan. Required if IsBlocked is true,
          must be empty if IsBlocked is false.
        type: string
      cycle_day:
        description: Cycle day of the month when the data plan resets (1-31). Optional,
          defaults to 0 (no cycle).
        type: integer
      is_blocked:
        description: Indicates whether the data plan is currently blocked. Optional,
          defaults to false.
        type: boolean
      total_mb:
        description: Total data plan in megabytes to be applied to the device
        type: integer
    type: object
  dto.DeleteWifiDTO:
    properties:
      ssid:
        description: SSID of the WiFi network to delete
        type: string
    type: object
  dto.DeviceStateDTO:
    type: object
  dto.OpenStreamDTO:
    properties:
      cam:
        type: string
      domain_endpoint:
        type: string
      port:
        type: string
      protocol:
        type: string
      timeout_seconds:
        type: string
    required:
    - cam
    - protocol
    type: object
  dto.OrderDTO:
    properties:
      correlation_id:
        description: |-
          CorrelationID is an optional unique identifier for request tracking.
          If not provided, it will be auto-generated.
        maxLength: 50
        minLength: 3
        type: string
      parameters:
        description: |-
          Parameters contains the specific data needed for the order type.
          The structure of each parameter depends on the order type.
          For example, ADD_WIFI parameters would contain ssid and password...
        items:
          oneOf:
            - $ref: '#/definitions/dto.AddWifiDTO'
              title: AddWifi
            - $ref: '#/definitions/dto.DeleteWifiDTO'
              title: DeleteWifi
            - $ref: '#/definitions/dto.DeviceStateDTO'
              title: DeviceState
            - $ref: '#/definitions/dto.RequestImageDTO'
              title: RequestImage
            - $ref: '#/definitions/dto.RequestVideoDTO'
              title: RequestVideo
            - $ref: '#/definitions/dto.RebootDTO'
              title: Reboot
            - $ref: '#/definitions/dto.PeriodicDTO'
              title: Periodic
            - $ref: '#/definitions/dto.VisionConfigDTO'
              title: VisionConfig
            - $ref: '#/definitions/dto.DataPlanConfigDTO'
              title: DataPlanConfig
            - $ref: '#/definitions/dto.OpenStreamDTO'
              title: OpenStream
            - $ref: '#/definitions/dto.CloseStreamDTO'
              title: CloseStream
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Type specifies the kind of order being requested.
    required:
    - parameters
    - type
    type: object
  dto.PeriodicDTO:
    properties:
      off_message_periodic_seconds:
        description: Turns off periodic messages for **seconds**
        type: integer
      on_message_first_seconds:
        description: Sends the first message after **seconds**
        type: integer
      on_message_period_seconds:
        description: Sends messages every **seconds**
        type: integer
    type: object
  dto.RebootDTO:
    type: object
  dto.RequestImageDTO:
    properties:
      cam:
        description: 'Camera to be used for image capture **Ex: (0 = DriverCam, 1
          = RoadCam)**'
        type: string
      start:
        description: 'Start of the time range for image capture in **RFC3339 format
          Ex: "2006-01-02T15:04:05Z07:00"**'
        type: string
    required:
    - cam
    type: object
  dto.RequestVideoDTO:
    properties:
      cam:
        description: 'Camera to be used for video capture **Ex: (0 = DriverCam, 1
          = RoadCam)**'
        type: string
      end:
        description: 'End of the time range for video capture in **RFC3339 format
          Ex: "2006-01-02T15:04:05Z07:00"**'
        type: string
      start:
        description: 'Start of the time range for video capture in **RFC3339 format
          Ex: "2006-01-02T15:04:05Z07:00"**'
        type: string
    required:
    - cam
    type: object
  dto.VisionConfigDTO:
    properties:
      active_face_detect:
        description: Enables or disables face detection
        type: boolean
    type: object
  mapper.OrderResponse:
    properties:
      correlationId:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      deviceId:
        type: string
      group:
        type: string
      id:
        type: string
      sourceCreatedAt:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  mapper.OrderSuccessAccepted:
    properties:
      orders:
        items:
          $ref: '#/definitions/mapper.SuccessAccepted'
        type: array
    type: object
  mapper.SuccessAccepted:
    properties:
      correlation_id:
        description: CorrelationID of the order
        type: string
      href:
        description: Href to the order resource avaiable to be accessed e.g. https://golfleet.v3sandbox.com/v1/devices/{device_id}/orders/{order_id}
        type: string
      id:
        description: ID of the order
        type: string
      status:
        description: Status of the order (PENDING, DELETED, FAILED, SENT, PROCESSEDED)
        type: string
    type: object
  model.OrderType:
    enum:
    - ADD_WIFI
    - DELETE_WIFI
    - DEVICE_STATE
    - REQUEST_IMAGE
    - REQUEST_VIDEO
    - CONFIG
    - REBOOT
    - INTERNAL
    - VISION_CONFIG
    - PERIODIC
    - DATAPLAN_CONFIG
    - OPEN_STREAM
    - CLOSE_STREAM
    type: string
    x-enum-varnames:
    - ADD_WIFI
    - DELETE_WIFI
    - DEVICE_STATE
    - REQUEST_IMAGE
    - REQUEST_VIDEO
    - ORDER_CONFIG
    - REBOOT
    - INTERNAL
    - VISION_CONFIG
    - PERIODIC
    - DATAPLAN_CONFIG
    - OPEN_STREAM
    - CLOSE_STREAM
  types.Source:
    properties:
      pointer:
        type: string
    type: object
  types.ValidationError:
    properties:
      code:
        description: Error code
        type: string
      detail:
        description: Human-readable error description
        type: string
      source:
        allOf:
        - $ref: '#/definitions/types.Source'
        description: Source of the error, e.g. the field that caused the error
      status:
        description: HTTP status code
        type: integer
      title:
        description: Human-readable error title
        type: string
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Aplicação em GO responsável por realizar a gestão de ordens para os
    dispositivos.
  title: Orders API
  version: 0.0.1
paths:
  /devices/{device_id}/orders:
    get:
      consumes:
      - application/json
      description: Retrieve a list of orders with optional filtering by device_id
        and correlation_id. Supports pagination.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filter by correlation ID
        in: query
        name: correlation_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Orders retrieved successfully
          schema:
            items:
              $ref: '#/definitions/mapper.OrderResponse'
            type: array
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Find orders with optional filtering
      tags:
      - Order
  /v1/devices/{device_id}/orders:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes multiple orders for a specific device.
        If the `ids` query parameter is provided, only the specified orders will be deleted.
        If omitted, all orders associated with the device may be removed (depending on implementation rules).
      parameters:
      - description: Unique identifier of the device
        in: path
        name: device_id
        required: true
        type: string
      - description: Comma-separated list of order IDs to delete **(e.g. id1,id2,id3)**
        in: query
        name: ids
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Order sended to deleted
          schema:
            $ref: '#/definitions/mapper.OrderSuccessAccepted'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Delete multiple orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: |-
        Submits a list of commands to be executed by the specified device.
        Each command in the list can be one of several supported types, such as:
        (**AddWifi**, **DeleteWifi**, **DeviceState**, **RequestImage**, **RequestVideo**, **Reboot**,
        **Periodic**, **VisionConfig**, **DataPlanConfig**, **OpenStream**, **CloseStream**).
      parameters:
      - description: ULID do Device
        in: path
        name: device_id
        required: true
        type: string
      - description: Create Order payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderDTO'
      - description: Order
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.OrderDTO'
      - description: Add Wifi
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.AddWifiDTO'
      - description: Delete Wifi
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteWifiDTO'
      - description: Device State
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DeviceStateDTO'
      - description: Request Image
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RequestImageDTO'
      - description: Request Video
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RequestVideoDTO'
      - description: Reboot
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RebootDTO'
      - description: Periodic
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.PeriodicDTO'
      - description: Vision Config
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.VisionConfigDTO'
      - description: Data Plan Config
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.DataPlanConfigDTO'
      - description: Open Stream
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.OpenStreamDTO'
      - description: Close Stream
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CloseStreamDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Order sended to created
          schema:
            $ref: '#/definitions/mapper.OrderSuccessAccepted'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.ValidationError'
      security:
      - ApiKeyAuth: []
      summary: Create new order
      tags:
      - Order
  /v1/devices/{device_id}/orders/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes a single order identified by its ID for a given device.
        This operation is irreversible and will permanently remove the order.
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Order sended to deleted
          schema:
            $ref: '#/definitions/mapper.OrderSuccessAccepted'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Delete a specific order
      tags:
      - Order
    get:
      consumes:
      - application/json
      description: Retrieve an order by its ID for a specific device
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order retrieved successfully
          schema:
            $ref: '#/definitions/mapper.OrderResponse'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ValidationError'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/types.ValidationError'
      summary: Get a specific order
      tags:
      - Order
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"
