basePath: /v1
definitions:
  dto.AddWifiDTO:
    properties:
      password:
        description: Senha da rede Wi-Fi
        type: string
      ssid:
        description: SSID da rede Wi-Fi
        type: string
    type: object
  dto.CloseStreamDTO:
    properties:
      cam:
        description: Identificador da câmera
        type: string
    required:
    - cam
    type: object
  dto.ConfigAudioDTO:
    properties:
      enabled:
        type: boolean
      globalVolume:
        type: number
    type: object
  dto.ConfigAudioEventDTO:
    properties:
      action:
        type: string
      assetId:
        type: string
      assetType:
        type: string
      checksum:
        type: string
      eventEnabled:
        type: boolean
      eventName:
        type: string
      folderName:
        type: string
      isPriority:
        type: boolean
      packageName:
        type: string
      soundEnabled:
        type: boolean
      tenant:
        type: string
      voiceEnabled:
        type: boolean
      volume:
        type: integer
    type: object
  dto.CreateOrderDTO:
    properties:
      orders:
        description: |-
          Lista de ordens individuais a serem criadas.
          Cada ordem do array é processada de forma independente.
        items:
          $ref: '#/definitions/dto.OrderDTO'
        type: array
    required:
    - orders
    type: object
    example:
      orders:
      - type: ADD_WIFI
        correlation_id: CMD_ADD_WIFI_001
        parameters:
        - ssid: OfficeWiFi
          password: secret123
      - type: DELETE_WIFI
        parameters:
        - ssid: GuestNetwork
      - type: DEVICE_STATE
        parameters:
        - {}
      - type: REQUEST_IMAGE
        parameters:
        - cam: "0"
          start: "2026-01-15T12:00:00Z"
      - type: REQUEST_VIDEO
        parameters:
        - cam: "1"
          start: "2026-01-15T12:00:00Z"
          end: "2026-01-15T12:02:00Z"
      - type: REBOOT
        parameters:
        - {}
      - type: PERIODIC
        parameters:
        - on_message_period_seconds: 60
          on_message_first_seconds: 10
          off_message_periodic_seconds: 300
      - type: VISION_CONFIG
        parameters:
        - active_face_detect: true
      - type: DATAPLAN_CONFIG
        parameters:
        - total_mb: 1024
          cycle_day: 1
          is_blocked: false
          block_reason: ""
      - type: CONFIG_AUDIO
        parameters:
        - enabled: true
          globalVolume: 80
      - type: CONFIG_AUDIO_EVENT
        parameters:
        - eventName: HarshBraking
          eventEnabled: true
          soundEnabled: true
          voiceEnabled: false
          volume: 70
          isPriority: false
      - type: OPEN_STREAM
        correlation_id: CMD_OPEN_STREAM_001
        parameters:
        - cam: "0"
          protocol: rtmp
          port: "1935"
          domain_endpoint: stream.example.com
          timeout_seconds: "30"
      - type: CLOSE_STREAM
        parameters:
        - cam: "0"
      - type: CONFIG
        parameters:
        - module: downloaderd
          key: S3_REGION
          value: us-east-1
          type: string
      - type: INTERNAL
        parameters:
        - module: system
          key: timezone
          value: America/Sao_Paulo
          type: string
  dto.DataPlanConfigDTO:
    properties:
      block_reason:
        description: Motivo do bloqueio do plano de dados. Obrigatório se is_blocked
          for true; deve ficar vazio se is_blocked for false.
        type: string
      cycle_day:
        description: Dia do ciclo no mês em que o plano de dados é reiniciado (1-31).
          Opcional; padrão 0 (sem ciclo).
        type: integer
      is_blocked:
        description: Indica se o plano de dados está bloqueado. Opcional; padrão
          false.
        type: boolean
      total_mb:
        description: Total do plano de dados em megabytes a ser aplicado ao dispositivo
        type: integer
    type: object
  dto.DeleteWifiDTO:
    properties:
      ssid:
        description: SSID da rede Wi-Fi a ser excluída
        type: string
    type: object
  dto.DeviceStateDTO:
    type: object
  dto.OpenStreamDTO:
    properties:
      cam:
        description: Identificador da câmera (0 = DriverCam, 1 = RoadCam)
        type: string
      domain_endpoint:
        description: Endpoint de domínio do servidor de transmissão
        type: string
      port:
        description: Porta do servidor de transmissão
        type: string
      protocol:
        description: Protocolo de transmissão
        type: string
      rtmp_url:
        description: URL completa de publicação RTMP incluindo a chave de transmissão
        type: string
      timeout_seconds:
        type: string
    required:
    - cam
    - protocol
    type: object
  dto.OrderDTO:
    properties:
      correlation_id:
        description: |-
          Identificador opcional para rastreamento da requisição.
          Se não informado, será gerado automaticamente.
        maxLength: 50
        minLength: 3
        type: string
      parameters:
        description: |-
          Dados específicos necessários para o tipo de ordem.
          A estrutura de cada parâmetro depende do tipo de ordem.
          Por exemplo, ADD_WIFI inclui ssid e password.
        example:
        - ssid: OfficeWiFi
          password: secret123
        items:
          oneOf:
            - $ref: '#/definitions/dto.AddWifiDTO'
              title: Adicionar Wi-Fi
            - $ref: '#/definitions/dto.DeleteWifiDTO'
              title: Excluir Wi-Fi
            - $ref: '#/definitions/dto.DeviceStateDTO'
              title: Estado do dispositivo
            - $ref: '#/definitions/dto.RequestImageDTO'
              title: Solicitar imagem
            - $ref: '#/definitions/dto.RequestVideoDTO'
              title: Solicitar vídeo
            - $ref: '#/definitions/dto.RebootDTO'
              title: Reiniciar
            - $ref: '#/definitions/dto.PeriodicDTO'
              title: Periódico
            - $ref: '#/definitions/dto.VisionConfigDTO'
              title: Configuração de visão
            - $ref: '#/definitions/dto.DataPlanConfigDTO'
              title: Configuração de plano de dados
            - $ref: '#/definitions/dto.OpenStreamDTO'
              title: Abrir transmissão
            - $ref: '#/definitions/dto.CloseStreamDTO'
              title: Fechar transmissão
            - $ref: '#/definitions/dto.ConfigAudioDTO'
              title: Configurar áudio
            - $ref: '#/definitions/dto.ConfigAudioEventDTO'
              title: Configurar evento de áudio
        type: array
      type:
        allOf:
        - $ref: '#/definitions/model.OrderType'
        description: Tipo de ordem solicitada.
    required:
    - parameters
    - type
    type: object
  dto.PeriodicDTO:
    properties:
      off_message_periodic_seconds:
        description: Desativa mensagens periódicas por **segundos**
        type: integer
      on_message_first_seconds:
        description: Envia a primeira mensagem após **segundos**
        type: integer
      on_message_period_seconds:
        description: Envia mensagens a cada **segundos**
        type: integer
    type: object
  dto.RebootDTO:
    type: object
  dto.RequestImageDTO:
    properties:
      cam:
        description: 'Câmera usada para captura de imagem. Ex.: (0 = DriverCam, 1
          = RoadCam)'
        type: string
      start:
        description: 'Início do intervalo de captura no formato RFC3339. Ex.: "2006-01-02T15:04:05Z07:00"'
        type: string
    required:
    - cam
    type: object
  dto.RequestVideoDTO:
    properties:
      cam:
        description: 'Câmera usada para captura de vídeo. Ex.: (0 = DriverCam, 1
          = RoadCam)'
        type: string
      end:
        description: 'Fim do intervalo de captura no formato RFC3339. Ex.: "2006-01-02T15:04:05Z07:00"'
        type: string
      start:
        description: 'Início do intervalo de captura no formato RFC3339. Ex.: "2006-01-02T15:04:05Z07:00"'
        type: string
    required:
    - cam
    type: object
  dto.VisionConfigDTO:
    properties:
      active_face_detect:
        description: Habilita ou desabilita a detecção facial
        type: boolean
    type: object
  health.HealthCheckResponse:
    properties:
      status:
        type: string
    type: object
  mapper.OrderResponse:
    properties:
      correlationId:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      deviceId:
        type: string
      group:
        type: string
      id:
        type: string
      sourceCreatedAt:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  mapper.OrderSuccessAccepted:
    properties:
      orders:
        items:
          $ref: '#/definitions/mapper.SuccessAccepted'
        type: array
    type: object
  mapper.SuccessAccepted:
    properties:
      correlation_id:
        description: Identificador de correlação da ordem
        type: string
      href:
        description: Link para o recurso da ordem
        type: string
      id:
        description: ID da ordem
        type: string
      status:
        description: Status da ordem
        type: string
    type: object
  model.OrderStatus:
    enum:
    - PENDING
    - SENT
    - PROCESSING
    - PROCESSED
    - ACK
    - NACK
    - FAILED
    - DELETED
    type: string
  model.OrderType:
    enum:
    - ADD_WIFI
    - CONFIG_AUDIO
    - CONFIG_AUDIO_EVENT
    - DELETE_WIFI
    - DEVICE_STATE
    - REQUEST_IMAGE
    - REQUEST_VIDEO
    - CONFIG
    - REBOOT
    - INTERNAL
    - VISION_CONFIG
    - PERIODIC
    - DATAPLAN_CONFIG
    - OPEN_STREAM
    - CLOSE_STREAM
    type: string
    x-enum-varnames:
    - ADD_WIFI
    - CONFIG_AUDIO
    - CONFIG_AUDIO_EVENT
    - DELETE_WIFI
    - DEVICE_STATE
    - REQUEST_IMAGE
    - REQUEST_VIDEO
    - ORDER_CONFIG
    - REBOOT
    - INTERNAL
    - VISION_CONFIG
    - PERIODIC
    - DATAPLAN_CONFIG
    - OPEN_STREAM
    - CLOSE_STREAM
  types.Source:
    properties:
      pointer:
        type: string
    type: object
  types.ValidationError:
    properties:
      code:
        description: Código do erro
        type: string
      detail:
        description: Descrição legível do erro
        type: string
      source:
        allOf:
        - $ref: '#/definitions/types.Source'
        description: Origem do erro, por exemplo o campo que causou o erro
      status:
        description: Código de status HTTP
        type: integer
      title:
        description: Título legível do erro
        type: string
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Serviço responsável por receber instruções remotas, encaminhá-las aos
    dispositivos em campo e disponibilizar o acompanhamento de cada solicitação.
  title: Orders API
  version: 0.0.1
paths:
  /devices/{device_id}/orders:
    get:
      consumes:
      - application/json
      description: Retorna a lista de ordens com filtros opcionais por dispositivo
        e identificador de correlação. Suporta paginação.
      parameters:
      - description: ID do dispositivo
        in: path
        name: device_id
        required: true
        type: string
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 10, máximo: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filtrar por identificador de correlação
        in: query
        name: correlation_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ordens recuperadas com sucesso
          schema:
            items:
              $ref: '#/definitions/mapper.OrderResponse'
            type: array
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
      operationId: buscar-ordens-com-filtros-opcionais
      summary: Buscar ordens com filtros opcionais
      tags:
      - Order
    delete:
      consumes:
      - application/json
      description: |-
        Exclui múltiplas ordens de um dispositivo específico.
        Se o parâmetro `ids` for informado, apenas as ordens indicadas serão excluídas.
        Se omitido, todas as ordens associadas ao dispositivo podem ser removidas (conforme regras de implementação).
      parameters:
      - description: Identificador único do dispositivo
        in: path
        name: device_id
        required: true
        type: string
      - description: "Lista de IDs de ordens separados por vírgula (ex.: id1,id2,id3)"
        in: query
        name: ids
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Ordem enviada para exclusão
          schema:
            $ref: '#/definitions/mapper.OrderSuccessAccepted'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/types.ValidationError'
      operationId: excluir-multiplas-ordens
      summary: Excluir múltiplas ordens
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: |-
        Envia uma lista de comandos para execução no dispositivo informado.
        Cada comando pode ser de um dos tipos suportados, como:
        (**Adicionar Wi-Fi**, **Excluir Wi-Fi**, **Estado do dispositivo**, **Solicitar imagem**, **Solicitar vídeo**, **Reiniciar**,
        **Periódico**, **Configuração de visão**, **Configuração de plano de dados**, **Configurar áudio**, **Configurar evento de áudio**).
      parameters:
      - description: ID do dispositivo
        in: path
        name: device_id
        required: true
        type: string
      - description: Payload para criação de ordens
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrderDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Ordem enviada para criação
          schema:
            $ref: '#/definitions/mapper.OrderSuccessAccepted'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/types.ValidationError'
      security:
      - ApiKeyAuth: []
      operationId: criar-nova-ordem
      summary: Criar nova ordem
      tags:
      - Order
  /healthz/ready:
    get:
      description: Verifica se a aplicação está pronta
      responses:
        "200":
          description: Aplicação pronta
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
        "503":
          description: Serviço indisponível
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
      operationId: verificar-se-a-aplicacao-esta-pronta
      summary: Verificar se a aplicação está pronta
      tags:
      - Health Check
  /devices/{device_id}/orders/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Exclui uma ordem específica pelo ID para o dispositivo informado.
        Esta operação é irreversível e remove permanentemente a ordem.
      parameters:
      - description: ID do dispositivo
        in: path
        name: device_id
        required: true
        type: string
      - description: ID da ordem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Ordem enviada para exclusão
          schema:
            $ref: '#/definitions/mapper.OrderSuccessAccepted'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/types.ValidationError'
      operationId: excluir-ordem-especifica
      summary: Excluir ordem específica
      tags:
      - Order
    get:
      consumes:
      - application/json
      description: Retorna uma ordem pelo ID para o dispositivo informado
      parameters:
      - description: ID do dispositivo
        in: path
        name: device_id
        required: true
        type: string
      - description: ID da ordem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ordem recuperada com sucesso
          schema:
            $ref: '#/definitions/mapper.OrderResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
        "404":
          description: Ordem não encontrada
          schema:
            $ref: '#/definitions/types.ValidationError'
      operationId: obter-ordem-especifica
      summary: Obter ordem específica
      tags:
      - Order
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"

