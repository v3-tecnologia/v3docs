basePath: /v1
definitions:
  dto.EventResponseDTO:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      device_id:
        type: string
      event_type:
        type: integer
      firmware_version:
        type: string
      hardware_event_type:
        type: integer
      hardware_model:
        type: string
      hook_delivered_at:
        type: string
      id:
        type: string
      is_ignition_on:
        type: boolean
      media_id:
        type: string
      odometer:
        type: number
      sourced_created_at:
        type: string
      tenant_delivered_at:
        type: string
      ulid:
        type: string
      updated_at:
        type: string
    type: object
  types.Source:
    properties:
      pointer:
        type: string
    type: object
  types.ValidationError:
    properties:
      code:
        description: Código do erro
        type: string
      detail:
        description: Descrição legível do erro
        type: string
      source:
        allOf:
        - $ref: '#/definitions/types.Source'
        description: Origem do erro, por exemplo o campo que causou o erro
      status:
        description: Código de status HTTP
        type: integer
      title:
        description: Título legível do erro
        type: string
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: API para consulta e gerenciamento de eventos de dispositivos.
  title: Event API
  version: 0.0.1
paths:
  /event/device/{device_id}:
    get:
      consumes:
      - application/json
      description: Recupera uma lista paginada de eventos associados ao ID do dispositivo
        informado
      parameters:
      - description: ID do dispositivo
        in: path
        name: device_id
        required: true
        type: string
      - default: 1
        description: Número da página
        in: query
        name: page
        type: integer
      - default: 10
        description: Quantidade de itens por página
        in: query
        maximum: 100
        name: page_size
        type: integer
      - description: Filtro de data/hora inicial no formato yyyy-MM-ddTHH:mm:ssZ
        in: query
        name: start
        type: string
      - description: Filtro de data/hora final no formato yyyy-MM-ddTHH:mm:ssZ
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de eventos
          schema:
            items:
              $ref: '#/definitions/dto.EventResponseDTO'
            type: array
        "204":
          description: Sem conteúdo
          schema:
            type: string
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
      operationId: listar-eventos-de-um-dispositivo
      summary: Listar eventos de um dispositivo
      tags:
      - Event
  /events/{ulid}:
    get:
      consumes:
      - application/json
      description: Recupera um evento usando o ULID informado
      parameters:
      - description: ULID do evento
        in: path
        name: ulid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Evento encontrado
          schema:
            $ref: '#/definitions/dto.EventResponseDTO'
        "204":
          description: Sem conteúdo
          schema:
            type: string
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/types.ValidationError'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/types.ValidationError'
      operationId: obter-evento-por-ulid
      summary: Obter evento por ULID
      tags:
      - Event
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"

