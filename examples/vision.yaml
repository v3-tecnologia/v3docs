basePath: /v1
definitions:
  response.Error:
    properties:
      code:
        type: string
      details:
        items: {}
        type: array
      message:
        type: string
    type: object
  response.Meta:
    properties:
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  response.VisionErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.Error'
      meta:
        $ref: '#/definitions/response.Meta'
    type: object
  response.VisionResponse:
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: |-
    A Vision API é o hub central de processamento de eventos recebidos pela plataforma,
    habilitando inferência de visão computacional.
    Visão computacional é um campo da inteligência artificial que permite interpretar
    e extrair informações de imagens e vídeos, simulando a visão humana.
    Esta solução atua como motor de processamento para eventos que chegam à nuvem,
    monitorados continuamente para análise e inferência.
  title: Vision API
  version: 0.0.1
paths:
  /datasets:
    post:
      consumes:
      - application/json
      description: Cria um novo conjunto de dados com os detalhes informados.
      parameters:
      - description: Detalhes do conjunto de dados
        in: body
        name: payload
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Conjunto de dados criado com sucesso
          schema:
            $ref: '#/definitions/response.VisionResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
      security:
      - ApiKeyAuth: []
      operationId: criar-novo-conjunto-de-dados
      summary: Criar novo conjunto de dados
      tags:
      - Datasets
  /datasets/{id}:
    delete:
      consumes:
      - application/json
      description: Exclui um conjunto de dados pelo seu ID.
      parameters:
      - description: ID do conjunto de dados
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Conjunto de dados excluído com sucesso
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "404":
          description: Conjunto de dados não encontrado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
      security:
      - ApiKeyAuth: []
      operationId: excluir-conjunto-de-dados-por-id
      summary: Excluir conjunto de dados por ID
      tags:
      - Datasets
    get:
      consumes:
      - application/json
      description: Recupera um conjunto de dados pelo seu ID.
      parameters:
      - description: ID do conjunto de dados
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Conjunto de dados recuperado com sucesso
          schema:
            $ref: '#/definitions/response.VisionResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "404":
          description: Conjunto de dados não encontrado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
      security:
      - ApiKeyAuth: []
      operationId: obter-conjunto-de-dados-por-id
      summary: Obter conjunto de dados por ID
      tags:
      - Datasets
    put:
      consumes:
      - application/json
      description: Atualiza um conjunto de dados existente pelo seu ID.
      parameters:
      - description: ID do conjunto de dados
        in: path
        name: id
        required: true
        type: string
      - description: Detalhes atualizados do conjunto de dados
        in: body
        name: payload
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Conjunto de dados atualizado com sucesso
          schema:
            $ref: '#/definitions/response.VisionResponse'
        "400":
          description: Requisição inválida
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "401":
          description: Não autorizado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "404":
          description: Conjunto de dados não encontrado
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/response.VisionErrorResponse'
      security:
      - ApiKeyAuth: []
      operationId: atualizar-conjunto-de-dados-por-id
      summary: Atualizar conjunto de dados por ID
      tags:
      - Datasets
schemes:
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"

