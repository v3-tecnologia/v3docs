basePath: /v1
definitions:
  dto.CreateDeviceDTO:
    properties:
      automatic_recognition:
        description: 'Indica se o dispositivo possui reconhecimento automático habilitado
          **Ex.:**: true'
        type: boolean
      certificate_id:
        description: Identificador único do certificado associado ao dispositivo.
        maxLength: 50
        minLength: 3
        type: string
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      fleet_id:
        description: 'ID da frota proprietária do dispositivo **Ex.:**: 1'
        type: string
      iccid:
        description: 'ICCID do cartão SIM **Ex.:**: "89550311000000000123"'
        maxLength: 20
        minLength: 19
        type: string
      imei:
        description: 'Número IMEI do dispositivo **Ex.:**: "123456789012345"'
        maxLength: 15
        minLength: 15
        type: string
      model:
        description: 'Modelo do dispositivo **Ex.:**: "GPS Tracker Pro"'
        maxLength: 50
        minLength: 3
        type: string
      phone_number:
        description: 'Número de telefone associado ao dispositivo **Ex.:**: "+5511999999999"'
        maxLength: 15
        minLength: 10
        type: string
    required:
    - imei
    type: object
  dto.CreateDriverDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do motorista **Ex.:**: "João Silva"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: ID do time para associação do motorista (opcional)
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.CreateFleetDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome da frota **Ex.:**: "Frota Principal"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: 'ID do time proprietário da frota **Ex.:**: 1'
        type: string
    required:
    - name
    - team_id
    type: object
  dto.CreateTeamDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do time **Ex.:**: "Time de Desenvolvimento"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.UpdateDeviceDTO:
    properties:
      automatic_recognition:
        description: 'Indica se o dispositivo possui reconhecimento automático habilitado
          **Ex.:**: true'
        type: boolean
      certificate_id:
        description: Identificador único do certificado associado ao dispositivo.
        maxLength: 50
        minLength: 3
        type: string
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      fleet_id:
        description: 'ID da frota proprietária do dispositivo **Ex.:**: 1'
        type: string
      iccid:
        description: 'ICCID do cartão SIM **Ex.:**: "89550311000000000123"'
        maxLength: 20
        minLength: 19
        type: string
      imei:
        description: 'Número IMEI do dispositivo **Ex.:**: "123456789012345"'
        maxLength: 15
        minLength: 15
        type: string
      model:
        description: 'Modelo do dispositivo **Ex.:**: "GPS Tracker Pro X"'
        maxLength: 50
        minLength: 3
        type: string
      phone_number:
        description: 'Número de telefone associado ao dispositivo **Ex.:**: "+5511999999999"'
        maxLength: 15
        minLength: 10
        type: string
    required:
    - imei
    type: object
  dto.UpdateDriverDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do motorista **Ex.:**: "João Silva Atualizado"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: ID do time para associação do motorista (opcional)
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.UpdateFleetDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome da frota **Ex.:**: "Frota Atualizada"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: 'ID do time proprietário da frota **Ex.:**: 1'
        type: string
    required:
    - name
    - team_id
    type: object
  dto.UpdateTeamDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do time **Ex.:**: "Time de Desenvolvimento Atualizado"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.DeviceResponse:
    properties:
      automatic_recognition:
        type: boolean
      certificate_id:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      fleet_id:
        type: string
      iccid:
        type: string
      id:
        type: string
      imei:
        type: string
      model:
        type: string
      phone_number:
        type: string
      status:
        $ref: '#/definitions/dto.DeviceStatusResponse'
      updated_at:
        type: string
    type: object
  dto.DeviceStatusPatchDTO:
    properties:
      area:
        type: integer
      carrier_code:
        type: string
      carrier_name:
        type: string
      cell_id:
        type: integer
      connection_type:
        type: string
      imei:
        type: string
      ip_address:
        type: string
      last_event_at:
        description: Timestamp ISO 8601 do último evento do dispositivo
        type: string
      latitude:
        type: number
      longitude:
        type: number
      altitude:
        type: number
      mcc:
        type: string
      mnc:
        type: string
      signal_strength:
        type: integer
      speed:
        type: number
    type: object
  dto.DeviceStatusResponse:
    properties:
      area:
        type: integer
      carrier_code:
        type: string
      carrier_name:
        type: string
      cell_id:
        type: integer
      connection_type:
        type: string
      created_at:
        type: string
      ip_address:
        type: string
      last_event_at:
        description: Timestamp ISO 8601 do último evento do dispositivo
        type: string
      latitude:
        type: number
      longitude:
        type: number
      altitude:
        type: number
      mcc:
        type: string
      mnc:
        type: string
      signal_strength:
        type: integer
      speed:
        type: number
      updated_at:
        type: string
    type: object
  dto.PatchDeviceStatusDTO:
    properties:
      iccid:
        type: string
      status:
        $ref: '#/definitions/dto.DeviceStatusPatchDTO'
    type: object
  health.HealthCheckResponse:
    properties:
      status:
        type: string
    type: object
  model.Device:
    properties:
      automatic_recognition:
        type: boolean
      certificate_id:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      fleet_id:
        type: string
      iccid:
        type: string
      id:
        type: string
      imei:
        type: string
      model:
        type: string
      phone_number:
        type: string
      updated_at:
        type: string
    type: object
  model.Driver:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      name:
        type: string
      team_id:
        type: string
      updated_at:
        type: string
    type: object
  model.Fleet:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      name:
        type: string
      team_id:
        type: string
      updated_at:
        type: string
    type: object
  model.Team:
    properties:
      account_id:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  service.PaginatedDevices:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.DeviceResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  service.PaginatedDrivers:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Driver'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  service.PaginatedFleets:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Fleet'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  service.PaginatedTeams:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Team'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Serviço responsável por organizar e manter motoristas, times, frotas
    e dispositivos vinculados à operação do cliente.
  title: Management API
  version: 0.0.1
paths:
  /healthz:
    get:
      description: Verifica se a aplicação está ativa
      responses:
        "200":
          description: Aplicação ativa
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: verificar-se-a-aplicacao-esta-ativa
      summary: Verificar se a aplicação está ativa
      tags:
      - Health Check
  /healthz/ready:
    get:
      description: Verifica se a aplicação está pronta
      responses:
        "200":
          description: Aplicação pronta
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
        "503":
          description: Serviço indisponível
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
      operationId: verificar-se-a-aplicacao-esta-pronta
      summary: Verificar se a aplicação está pronta
      tags:
      - Health Check
  /management/devices:
    get:
      description: |-
        Retorna a lista de dispositivos com filtros opcionais por identificador de correlação,
        ID da frota ou IMEI. Suporta paginação. Apenas um filtro pode ser utilizado por vez.
      parameters:
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 10, máximo: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filtrar por identificador de correlação
        in: query
        name: correlation_id
        type: string
      - description: Filtrar por ID da frota
        in: query
        name: fleet_id
        type: string
      - description: Filtrar por IMEI
        in: query
        name: imei
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivos recuperados com sucesso
          schema:
            $ref: '#/definitions/service.PaginatedDevices'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: listar-dispositivos-com-paginacao
      summary: Listar dispositivos com paginação
      tags:
      - Device
    post:
      consumes:
      - application/json
      description: Cadastra um novo dispositivo com os dados informados no corpo da
        requisição.
      parameters:
      - description: Dados do dispositivo
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Criado
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "422":
          description: Entidade não processável
          schema: {}
      operationId: criar-novo-dispositivo
      summary: Criar novo dispositivo
      tags:
      - Device
  /management/devices/{id}:
    delete:
      description: Remove um dispositivo pelo ID informado.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Dispositivo removido
          schema:
            type: string
        "422":
          description: Entidade não processável
          schema: {}
      operationId: excluir-dispositivo
      summary: Excluir dispositivo
      tags:
      - Device
    get:
      description: Retorna os dados de um dispositivo específico pelo ID informado.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivo recuperado com sucesso
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "404":
          description: Dispositivo não encontrado
          schema: {}
      operationId: obter-dispositivo-por-id
      summary: Obter dispositivo por ID
      tags:
      - Device
    patch:
      consumes:
      - application/json
      description: Atualiza parcialmente o status de telemetria e o ICCID do dispositivo.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      - description: Dados de status do dispositivo
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.PatchDeviceStatusDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivo atualizado com sucesso
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "404":
          description: Dispositivo não encontrado
          schema: {}
        "422":
          description: Entidade não processável
          schema: {}
      operationId: atualizar-status-do-dispositivo
      summary: Atualizar status do dispositivo
      tags:
      - Device
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um dispositivo existente com as informações
        informadas no corpo da requisição.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      - description: Dados do dispositivo
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDeviceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivo atualizado com sucesso
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "404":
          description: Dispositivo não encontrado
          schema: {}
        "422":
          description: Entidade não processável
          schema: {}
      operationId: atualizar-dispositivo
      summary: Atualizar dispositivo
      tags:
      - Device
  /management/drivers:
    get:
      description: |-
        Retorna a lista de motoristas com filtros opcionais por identificador de correlação
        ou ID do time. Suporta paginação. Apenas um filtro pode ser utilizado por vez.
      parameters:
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 10, máximo: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filtrar por identificador de correlação
        in: query
        name: correlation_id
        type: string
      - description: Filtrar por ID do time
        in: query
        name: team_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Motoristas recuperados com sucesso
          schema:
            $ref: '#/definitions/service.PaginatedDrivers'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: listar-motoristas-com-paginacao
      summary: Listar motoristas com paginação
      tags:
      - Driver
    post:
      consumes:
      - application/json
      description: Cadastra um novo motorista com os dados informados no corpo da
        requisição.
      parameters:
      - description: Dados do motorista
        in: body
        name: driver
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDriverDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Criado
          schema:
            $ref: '#/definitions/model.Driver'
        "422":
          description: Entidade não processável
          schema: {}
      operationId: criar-novo-motorista
      summary: Criar novo motorista
      tags:
      - Driver
  /management/drivers/{id}:
    delete:
      description: Remove um motorista pelo ID informado.
      parameters:
      - description: ID do motorista
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Motorista removido
          schema:
            type: string
        "422":
          description: Entidade não processável
          schema: {}
      operationId: excluir-motorista
      summary: Excluir motorista
      tags:
      - Driver
    get:
      description: Retorna os dados de um motorista específico pelo ID informado.
      parameters:
      - description: ID do motorista
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Motorista recuperado com sucesso
          schema:
            $ref: '#/definitions/model.Driver'
        "404":
          description: Motorista não encontrado
          schema: {}
      operationId: obter-motorista-por-id
      summary: Obter motorista por ID
      tags:
      - Driver
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um motorista existente com as informações
        informadas no corpo da requisição.
      parameters:
      - description: ID do motorista
        in: path
        name: id
        required: true
        type: string
      - description: Dados do motorista
        in: body
        name: driver
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDriverDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Motorista atualizado com sucesso
          schema:
            $ref: '#/definitions/model.Driver'
        "404":
          description: Motorista não encontrado
          schema: {}
        "422":
          description: Entidade não processável
          schema: {}
      operationId: atualizar-motorista
      summary: Atualizar motorista
      tags:
      - Driver
  /management/drivers/{id}/teams/{team_id}:
    delete:
      description: Remove a associação de um motorista com um time.
      parameters:
      - description: ID do motorista
        in: path
        name: id
        required: true
        type: string
      - description: ID do time
        in: path
        name: team_id
        required: true
        type: string
      responses:
        "200":
          description: Motorista removido do time
          schema:
            type: string
        "422":
          description: Entidade não processável
          schema: {}
      operationId: remover-motorista-do-time
      summary: Remover motorista do time
      tags:
      - Driver
    post:
      consumes:
      - application/json
      description: Associa um motorista a um time. Requer o ID do motorista e o ID
        do time como parâmetros da URL.
      parameters:
      - description: ID do motorista
        in: path
        name: id
        required: true
        type: string
      - description: ID do time
        in: path
        name: team_id
        required: true
        type: string
      responses:
        "200":
          description: Motorista associado ao time
          schema:
            type: string
        "422":
          description: Entidade não processável
          schema: {}
      operationId: associar-motorista-ao-time
      summary: Associar motorista ao time
      tags:
      - Driver
  /management/fleets:
    get:
      description: |-
        Retorna a lista de frotas com filtros opcionais por identificador de correlação
        ou ID do time. Suporta paginação. Apenas um filtro pode ser utilizado por vez.
      parameters:
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 10, máximo: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filtrar por identificador de correlação
        in: query
        name: correlation_id
        type: string
      - description: Filtrar por ID do time
        in: query
        name: team_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Frotas recuperadas com sucesso
          schema:
            $ref: '#/definitions/service.PaginatedFleets'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: listar-frotas-com-paginacao
