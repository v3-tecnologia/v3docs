host: tenant.v3sandbox.com
info:
  contact: {}
  description: Serviço responsável por organizar e manter motoristas, times, frotas
    e dispositivos vinculados à operação do cliente.
  title: Management API
  version: 0.0.1
paths:
  /healthz:
    get:
      description: Verifica se a aplicação está ativa
      responses:
        "200":
          description: Aplicação ativa
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: verificar-se-a-aplicacao-esta-ativa
      summary: Verificar se a aplicação está ativa
      tags:
      - Health Check
  /healthz/ready:
    get:
      description: Verifica se a aplicação está pronta
      responses:
        "200":
          description: Aplicação pronta
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
        "503":
          description: Serviço indisponível
          schema:
            $ref: '#/definitions/health.HealthCheckResponse'
      operationId: verificar-se-a-aplicacao-esta-pronta
      summary: Verificar se a aplicação está pronta
      tags:
      - Health Check
  /internal/management/teams/cards:
    get:
      consumes:
      - application/json
      description: |-
        Busca os times associados a um cartão pelo número, localizando primeiro o motorista vinculado.
        Retorna 200 com uma lista vazia quando nenhum time é encontrado para o número do cartão.
      parameters:
      - description: Número do cartão
        in: query
        name: number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retorna os times paginados; a lista fica vazia quando nenhum resultado é encontrado.
          schema:
            $ref: '#/definitions/service.PaginatedTeams'
        "422":
          description: O número do cartão é obrigatório.
          schema: {}
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: find-teams-by-card-number
      summary: Buscar times pelo número do cartão
      tags:
      - Times
  /internal/management/teams/devices:
    get:
      consumes:
      - application/json
      description: |-
        Busca os times associados a um dispositivo pelo IMEI, localizando primeiro a frota vinculada.
        Retorna 200 com uma lista vazia quando nenhum time é encontrado para o IMEI.
      parameters:
      - description: IMEI do dispositivo
        in: query
        name: imei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Retorna os times paginados; a lista fica vazia quando nenhum resultado é encontrado.
          schema:
            $ref: '#/definitions/service.PaginatedTeams'
        "422":
          description: O IMEI é obrigatório.
          schema: {}
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: find-teams-by-device-imei
      summary: Buscar times pelo IMEI do dispositivo
      tags:
      - Times
  /management/devices:
    get:
      description: |-
        Retorna a lista de dispositivos com filtros opcionais por identificador de correlação,
        ID da frota ou IMEI. Suporta paginação. Apenas um filtro pode ser utilizado por vez.
      parameters:
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 10, máximo: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filtrar por identificador de correlação
        in: query
        name: correlation_id
        type: string
      - description: Filtrar por ID da frota
        in: query
        name: fleet_id
        type: string
      - description: Filtrar por ID do grupo empresarial
        in: query
        name: company_group_id
        type: string
      - description: Filtrar por IMEI
        in: query
        name: imei
        type: string
      - description: Filtrar por placa do veículo
        in: query
        name: license_plate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivos recuperados com sucesso
          schema:
            $ref: '#/definitions/service.PaginatedDevices'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: listar-dispositivos-com-paginacao
      summary: Listar dispositivos com paginação
      tags:
      - Dispositivos
    post:
      consumes:
      - application/json
      description: Cadastra um novo dispositivo com os dados informados no corpo da
        requisição.
      parameters:
      - description: Dados do dispositivo
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Criado
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "422":
          description: Entidade não processável
          schema: {}
      operationId: criar-novo-dispositivo
      summary: Criar novo dispositivo
      tags:
      - Dispositivos
  /management/devices/{id}:
    delete:
      description: Remove um dispositivo pelo ID informado.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Dispositivo removido
          schema:
            type: string
        "422":
          description: Entidade não processável
          schema: {}
      operationId: excluir-dispositivo
      summary: Excluir dispositivo
      tags:
      - Dispositivos
    get:
      description: Retorna os dados de um dispositivo específico pelo ID informado.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivo recuperado com sucesso
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "404":
          description: Dispositivo não encontrado
          schema: {}
      operationId: obter-dispositivo-por-id
      summary: Obter dispositivo por ID
      tags:
      - Dispositivos
    patch:
      consumes:
      - application/json
      description: Atualiza parcialmente o status, o ICCID, o modelo e a versão do firmware do dispositivo.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      - description: Dados de status do dispositivo
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.PatchDeviceStatusDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivo atualizado com sucesso
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "404":
          description: Dispositivo não encontrado
          schema: {}
        "422":
          description: Entidade não processável
          schema: {}
      operationId: atualizar-status-do-dispositivo
      summary: Atualizar status do dispositivo
      tags:
      - Dispositivos
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um dispositivo existente com as informações
        informadas no corpo da requisição.
      parameters:
      - description: ID do dispositivo
        in: path
        name: id
        required: true
        type: string
      - description: Dados do dispositivo
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDeviceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Dispositivo atualizado com sucesso
          schema:
            $ref: '#/definitions/dto.DeviceResponse'
        "404":
          description: Dispositivo não encontrado
          schema: {}
        "422":
          description: Entidade não processável
          schema: {}
      operationId: atualizar-dispositivo
      summary: Atualizar dispositivo
      tags:
      - Dispositivos
  /management/drivers:
    get:
      description: |-
        Retorna a lista de motoristas com filtros opcionais por identificador de correlação
        ou ID do time. Suporta paginação. Apenas um filtro pode ser utilizado por vez.
      parameters:
      - description: 'Número da página (padrão: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 10, máximo: 100)'
        in: query
        name: page_size
        type: integer
      - description: Filtrar por identificador de correlação
        in: query
        name: correlation_id
        type: string
      - description: Filtrar por ID do time
        in: query
        name: team_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Motoristas recuperados com sucesso
          schema:
            $ref: '#/definitions/service.PaginatedDrivers'
        "500":
          description: Erro interno do servidor
          schema: {}
      operationId: listar-motoristas-com-paginacao
      summary: Listar motoristas com paginação
      tags:
      - Motorista
    post:
      consumes:
      - application/json
      description: Cadastra um novo motorista com os dados informados no corpo da
        requisição.
      parameters:
      - description: Dados do motorista
        in: body
        name: driver
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDriverDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Criado
          schema:
            $ref: '#/definitions/model.Driver'
        "422":
          description: Entidade não processável
          schema: {}
      operationId: criar-novo-motorista
      summary: Criar novo motorista
      tags:
      - Motorista
  /management/drivers/{id}:
    delete:
      description: Remove um motorista pelo ID informado.
      parameters:
      - description: ID do motorista
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Motorista removido
