basePath: /v1
definitions:
  dto.CardDTO:
    properties:
      embed_device_ids:
        description: 'Lista de IDs de dispositivos associados ao cartão **Exemplo**: ["device1",
          "device2"]'
        items:
          type: string
        type: array
      number:
        description: 'Número do cartão **Exemplo**: "4111111111111111"'
        type: string
    required:
    - number
    type: object
  dto.CreateDeviceDTO:
    properties:
      automatic_recognition:
        description: 'Indica se o dispositivo possui reconhecimento automático habilitado
          **Ex.:**: true'
        type: boolean
      certificate_id:
        description: Identificador único do certificado associado ao dispositivo.
        maxLength: 50
        minLength: 3
        type: string
      company_group_id:
        description: ID do grupo empresarial proprietário do dispositivo.
        type: string
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      fleet_id:
        description: 'ID da frota proprietária do dispositivo **Ex.:**: 1'
        type: string
      iccid:
        description: 'ICCID do cartão SIM **Ex.:**: "89550311000000000123"'
        maxLength: 20
        minLength: 19
        type: string
      imei:
        description: 'Número IMEI do dispositivo **Ex.:**: "123456789012345"'
        maxLength: 15
        minLength: 15
        type: string
      license_plate:
        description: 'Placa do veículo associado ao dispositivo **Ex.:**: "ABC1D23"'
        type: string
      model:
        description: 'Modelo do dispositivo **Ex.:**: "GPS Tracker Pro"'
        maxLength: 50
        minLength: 3
        type: string
      phone_number:
        description: 'Número de telefone associado ao dispositivo **Ex.:**: "+5511999999999"'
        maxLength: 15
        minLength: 10
        type: string
    required:
    - imei
    type: object
  dto.CreateDriverDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do motorista **Ex.:**: "João Silva"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: ID do time para associação do motorista (opcional)
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.CreateFleetDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome da frota **Ex.:**: "Frota Principal"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: 'ID do time proprietário da frota **Ex.:**: 1'
        type: string
    required:
    - name
    - team_id
    type: object
  dto.CreateTeamDTO:
    properties:
      company_group_id:
        description: ID do grupo empresarial proprietário do time.
        type: string
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do time **Ex.:**: "Time de Desenvolvimento"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.UpdateDeviceDTO:
    properties:
      automatic_recognition:
        description: 'Indica se o dispositivo possui reconhecimento automático habilitado
          **Ex.:**: true'
        type: boolean
      certificate_id:
        description: Identificador único do certificado associado ao dispositivo.
        maxLength: 50
        minLength: 3
        type: string
      company_group_id:
        description: ID do grupo empresarial proprietário do dispositivo.
        type: string
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      fleet_id:
        description: 'ID da frota proprietária do dispositivo **Ex.:**: 1'
        type: string
      firmware_version:
        description: 'Versão do firmware informada pelo dispositivo **Ex.:**: "1.2.3"'
        maxLength: 100
        minLength: 1
        type: string
      iccid:
        description: 'ICCID do cartão SIM **Ex.:**: "89550311000000000123"'
        maxLength: 20
        minLength: 19
        type: string
      imei:
        description: 'Número IMEI do dispositivo **Ex.:**: "123456789012345"'
        maxLength: 15
        minLength: 15
        type: string
      license_plate:
        description: 'Placa do veículo associado ao dispositivo **Ex.:**: "ABC1D23"'
        type: string
      model:
        description: 'Modelo do dispositivo **Ex.:**: "GPS Tracker Pro X"'
        maxLength: 50
        minLength: 3
        type: string
      phone_number:
        description: 'Número de telefone associado ao dispositivo **Ex.:**: "+5511999999999"'
        maxLength: 15
        minLength: 10
        type: string
    required:
    - imei
    type: object
  dto.UpdateDriverDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do motorista **Ex.:**: "João Silva Atualizado"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: ID do time para associação do motorista (opcional)
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.UpdateFleetDTO:
    properties:
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome da frota **Ex.:**: "Frota Atualizada"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: 'ID do time proprietário da frota **Ex.:**: 1'
        type: string
    required:
    - name
    - team_id
    type: object
  dto.UpdateTeamDTO:
    properties:
      company_group_id:
        description: ID do grupo empresarial proprietário do time.
        type: string
      correlation_id:
        description: 'Identificador único para rastreamento da requisição (opcional,
          gerado automaticamente se não informado) **Ex.:**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Nome do time **Ex.:**: "Time de Desenvolvimento Atualizado"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.DeleteCardDTO:
    properties:
      remove_device_ids:
        description: 'Lista de IDs dos dispositivos dos quais remover o cartão **Exemplo**: ["device1",
          "device2"]'
        items:
          type: string
        type: array
    type: object
  dto.DeviceResponse:
    properties:
      automatic_recognition:
        type: boolean
      certificate_id:
        type: string
      company_group_id:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      fleet_id:
        type: string
      firmware_version:
        type: string
      iccid:
        type: string
      id:
        type: string
      imei:
        type: string
      license_plate:
        type: string
      model:
        type: string
      phone_number:
        type: string
      status:
        $ref: '#/definitions/dto.DeviceStatusResponse'
      updated_at:
        type: string
