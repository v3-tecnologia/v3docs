        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Name of the driver **Example**: "John Doe Updated"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - correlation_id
    - name
    type: object
  dto.UpdateFleetDTO:
    properties:
      correlation_id:
        description: 'Unique identifier for request tracking **Example**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Name of the fleet **Example**: "Updated Fleet"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: 'ID of the team that owns the fleet **Example**: 1'
        type: integer
    required:
    - correlation_id
    - name
    - team_id
    type: object
  dto.UpdateTeamDTO:
    properties:
      account_id:
        description: 'ID of the account that owns the team **Example**: 1'
        type: integer
      correlation_id:
        description: 'Unique identifier for request tracking **Example**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Name of the team **Example**: "Updated Development Team"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - account_id
    - correlation_id
    - name
    type: object
  model.Device:
    properties:
      automatic_recognition:
        type: boolean
      created_at:
        type: string
      deleted_at:
        type: string
      fleet_id:
        type: integer
      iccid:
        type: string
      id:
        type: integer
      imei:
        type: string
      model:
        type: string
      phone_number:
        type: string
      ulid:
        type: string
      updated_at:
        type: string
    type: object
  model.Driver:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      name:
        type: string
      ulid:
        type: string
      updated_at:
        type: string
    type: object
  model.Fleet:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      name:
        type: string
      team_id:
        type: integer
      ulid:
        type: string
      updated_at:
        type: string
    type: object
  model.Team:
    properties:
      account_id:
        type: integer
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      name:
        type: string
      ulid:
        type: string
      updated_at:
        type: string
    type: object
  model.TeamDriver:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      driver_id:
        type: integer
      id:
        type: integer
      team_id:
        type: integer
      ulid:
        type: string
    type: object
  service.PaginatedDevices:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Device'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  service.PaginatedDrivers:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Driver'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  service.PaginatedFleets:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Fleet'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  service.PaginatedTeams:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Team'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Aplicação em GO responsável por realizar o CRUD das estruturas base.
  title: Management API
  version: 0.0.1
paths:
  /management/device:
    post:
      consumes:
      - application/json
      description: |-
        Create handles the HTTP request to create a new device.
        It parses the request body into a CreateDeviceDTO, validates the input,
        and calls the device service to create the device. On success, it returns
        the created device with HTTP 201 status. On error, it returns an appropriate
        HTTP error status and message.
      parameters:
      - description: Device Data
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Device'
        "422":
          description: Unprocessable Entity
          schema: {}
      summary: Create a new device
      tags:
      - Device
  /management/device/{id}:
    delete:
      description: |-
        Delete handles HTTP DELETE requests to remove a device resource by its ID.
        It parses the "id" parameter from the request URL, validates it, and calls the deviceService.Delete method.
        If the ID is invalid or the deletion fails, it returns a 422 Unprocessable Entity status with an error message.
        On successful deletion, it returns a 200 OK status with an empty response body.
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Device removed
          schema:
            type: string
        "422":
          description: Unprocessable Entity
          schema: {}
      summary: Delete a device
      tags:
      - Device
    get:
      description: |-
        FindOne handles HTTP requests to retrieve a single device by its ID.
        It parses the "id" parameter from the request URL, validates it, and calls the deviceService to fetch the device.
        If the ID is invalid, it returns a 422 Unprocessable Entity response.
        If the device is not found, it returns a 404 Not Found response.
        On success, it returns the device data with a 200 OK response.
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Device'
        "404":
          description: Not Found
          schema: {}
      summary: Get a device by ID
      tags:
      - Device
    put:
      consumes:
      - application/json
      description: |-
        Update handles the HTTP PUT request to update an existing device entity.
        It parses the device ID from the URL parameters, validates the request body,
        and updates the device using the provided service. Returns appropriate HTTP
        status codes and error messages for invalid input, validation errors, or if
        the device is not found.
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      - description: Device Data
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDeviceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Device'
        "404":
          description: Not Found
          schema: {}
        "422":
          description: Unprocessable Entity
          schema: {}
      summary: Update a device
      tags:
      - Device
  /management/device/imei/{imei}:
    get:
      description: |-
        FindByIMEI handles HTTP requests to retrieve a single device by its IMEI.
        It parses the "imei" parameter from the request URL, validates it, and calls the deviceService to fetch the device.
        If the IMEI is invalid, it returns a 422 Unprocessable Entity response.
        If the device is not found, it returns a 404 Not Found response.
        On success, it returns the device data with a 200 OK response.
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Device'
        "404":
          description: Not Found
          schema: {}
      summary: Get a device by IMEI
      tags:
      - Device
  /management/device/ulid/{ulid}:
    get:
      description: |-
        FindByULID handles HTTP requests to retrieve a single device by its ULID.
        It parses the "ulid" parameter from the request URL, validates it, and calls the deviceService to fetch the device.
        If the ULID is invalid, it returns a 422 Unprocessable Entity response.
        If the device is not found, it returns a 404 Not Found response.
        On success, it returns the device data with a 200 OK response.
      parameters:
      - description: Device ULID
        in: path
        name: ulid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Device'
        "404":
          description: Not Found
          schema: {}
      summary: Get a device by ULID
      tags:
      - Device
  /management/devices:
    get:
      description: |-
        FindAll handles HTTP GET requests to retrieve device records with optional filtering and pagination.
        It supports filtering by either "ulid" or "fleetId" query parameters, but not both simultaneously.
        If both filters are provided, it returns a 400 Bad Request error.
        Pagination is controlled via "page" and "page_size" query parameters, with defaults and limits applied.
        Returns a JSON response containing the paginated devices or an error message.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PaginatedDevices'
        "500":
          description: Internal Server Error
          schema: {}
      summary: List devices with pagination
      tags:
      - Device
  /management/devices/fleets/{fleetId}:
    get:
      description: |-
        FindByFleet handles HTTP GET requests to retrieve device records associated with a specific fleet.
        It expects the fleet ID as a URL parameter, validates it, and returns a paginated list of devices
        belonging to that fleet. Returns appropriate HTTP status codes and error messages for invalid
        fleet IDs or if no devices are found.
      parameters:
      - description: Fleet ID
        in: path
        name: fleetId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PaginatedDevices'
        "422":
          description: Unprocessable Entity
          schema: {}
      summary: Get devices by fleet ID
      tags:
      - Device
  /management/driver:
    post:
      consumes:
      - application/json
      description: |-
        Create handles the HTTP request to create a new driver.
        It parses the request body into a CreateDriverDTO, validates the input,
        and calls the driver service to create the driver. On success, it returns
        the created driver with HTTP 201 status. On error, it returns an appropriate
