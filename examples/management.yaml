  dto.DeviceStatusPatchDTO:
    properties:
      area:
        type: integer
      carrier_code:
        type: string
      carrier_name:
        type: string
      cell_id:
        type: integer
      connection_type:
        type: string
      imei:
        type: string
      ip_address:
        type: string
      last_event_at:
