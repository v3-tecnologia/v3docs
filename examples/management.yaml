  dto.DeviceStatusResponse:
    properties:
      area:
        type: integer
      carrier_code:
        type: string
      carrier_name:
        type: string
      cell_id:
        type: integer
      connection_type:
        type: string
      created_at:
        type: string
      ip_address:
        type: string
      last_event_at:
        description: Timestamp ISO 8601 do último evento do dispositivo
        type: string
      latitude:
        type: number
      longitude:
        type: number
      altitude:
        type: number
      mcc:
        type: string
      mnc:
        type: string
      signal_strength:
        type: integer
      speed:
        type: number
      updated_at:
        type: string
    type: object
  dto.PatchDeviceStatusDTO:
    properties:
      firmware_version:
        type: string
      iccid:
        type: string
      model:
        type: string
      status:
        $ref: '#/definitions/dto.DeviceStatusPatchDTO'
    type: object
  health.HealthCheckResponse:
    properties:
      status:
        type: string
    type: object
  model.Device:
    properties:
      automatic_recognition:
        type: boolean
      certificate_id:
        type: string
      company_group_id:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      fleet_id:
        type: string
      firmware_version:
        type: string
      iccid:
        type: string
      id:
        type: string
      imei:
        type: string
      license_plate:
        type: string
