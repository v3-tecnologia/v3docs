      produces:
      - application/json
      responses:
        "201":
          description: Criado
          schema:
            $ref: '#/definitions/model.Fleet'
        "422":
          description: Entidade não processável
          schema: {}
      operationId: criar-nova-frota
      summary: Criar nova frota
      tags:
      - Fleet
  /management/fleets/{id}:
    delete:
      description: Remove uma frota pelo ID informado.
      parameters:
      - description: ID da frota
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Frota removida
          schema:
            type: string
        "422":
          description: Entidade não processável
          schema: {}
      operationId: excluir-frota
      summary: Excluir frota
      tags:
