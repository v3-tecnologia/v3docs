basePath: /v1
definitions:
  dto.CreateDeviceDTO:
    properties:
      automatic_recognition:
        description: 'Flag indicating if the device has automatic recognition enabled
          **Example**: true'
        type: boolean
      fleet_id:
        description: 'ID of the fleet that owns the device **Example**: 1'
        type: integer
      iccid:
        description: 'ICCID of the SIM card **Example**: "89550311000000000123"'
        maxLength: 20
        minLength: 19
        type: string
      imei:
        description: 'IMEI number of the device **Example**: "123456789012345"'
        maxLength: 15
        minLength: 15
        type: string
      model:
        description: 'Model of the device **Example**: "GPS Tracker Pro"'
        maxLength: 50
        minLength: 3
        type: string
      phone_number:
        description: 'Phone number associated with the device **Example**: "+5511999999999"'
        maxLength: 15
        minLength: 10
        type: string
    required:
    - fleet_id
    - iccid
    - imei
    - model
    - phone_number
    type: object
  dto.CreateDriverDTO:
    properties:
      correlation_id:
        description: 'Unique identifier for request tracking **Example**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Name of the driver **Example**: "John Doe"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - correlation_id
    - name
    type: object
  dto.CreateFleetDTO:
    properties:
      correlation_id:
        description: 'Unique identifier for request tracking **Example**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Name of the fleet **Example**: "Main Fleet"'
        maxLength: 100
        minLength: 3
        type: string
      team_id:
        description: 'ID of the team that owns the fleet **Example**: 1'
        type: integer
    required:
    - correlation_id
    - name
    - team_id
    type: object
  dto.CreateTeamDTO:
    properties:
      account_id:
        description: 'ID of the account that owns the team **Example**: 1'
        type: integer
      correlation_id:
        description: 'Unique identifier for request tracking **Example**: "123e4567-e89b-12d3-a456-426614174000"'
        maxLength: 50
        minLength: 3
        type: string
      name:
        description: 'Name of the team **Example**: "Development Team"'
        maxLength: 100
        minLength: 3
        type: string
    required:
    - account_id
    - correlation_id
    - name
    type: object
  dto.UpdateDeviceDTO:
    properties:
      automatic_recognition:
        description: 'Flag indicating if the device has automatic recognition enabled
          **Example**: true'
        type: boolean
      fleet_id:
        description: 'ID of the fleet that owns the device **Example**: 1'
        type: integer
      iccid:
        description: 'ICCID of the SIM card **Example**: "89550311000000000123"'
        maxLength: 20
        minLength: 19
        type: string
      imei:
        description: 'IMEI number of the device **Example**: "123456789012345"'
        maxLength: 15
        minLength: 15
        type: string
      model:
        description: 'Model of the device **Example**: "GPS Tracker Pro X"'
        maxLength: 50
        minLength: 3
        type: string
      phone_number:
        description: 'Phone number associated with the device **Example**: "+5511999999999"'
        maxLength: 15
        minLength: 10
        type: string
    required:
    - fleet_id
    - iccid
    - imei
    - model
    - phone_number
    type: object
  dto.UpdateDriverDTO:
    properties:
      correlation_id:
