basePath: /v1
definitions:
  dto.AddWifiDTO:
    properties:
      password:
        description: Password of the Wifi network
        type: string
      ssid:
        description: SSID of the WiFi network
        type: string
    type: object
  dto.CamBehaviorDTO:
    properties:
      cam_behavior:
        allOf:
          - $ref: "#/definitions/dto.CamBehaviorType"
        description: Type of the stream (e.g., "video", "audio")
    type: object
  dto.CamBehaviorType:
    enum:
      - recording_and_stream
      - stream_only
      - recording_only
      - normal
    type: string
    x-enum-varnames:
      - StreamAndRecord
      - StreamOnly
      - RecordingOnly
      - Normal
  dto.CardDriverDTO:
    properties:
      action:
        description: >-
          Action is the action to perform: enable_matching,
          enable_identification,

          configure_matching, register_driver, or remove_driver.
        type: string
      card_number:
        description: CardNumber is the card number
        type: string
      cloud_match_enabled:
        description: CloudMatchEnabled enables or disables cloud matching.
        type: boolean
      driver_id:
        description: DriverID is the unique identifier of the driver associated with the
          card (required for register_driver action)
        type: string
      driver_name:
        description: DriverName is the driver's display name associated with the card.
        type: string
      edge_match_enabled:
        description: EdgeMatchEnabled enables or disables edge matching.
        type: boolean
      enabled:
        description: Enabled enables or disables the driver matching module.
        type: boolean
      identification_enabled:
        description: IdentificationEnabled enables or disables driver identification.
        type: boolean
      identification_timeout_enabled:
        description: IdentificationTimeoutEnabled enables or disables the identification
          timeout.
        type: boolean
      identification_timeout_seconds:
        description: IdentificationTimeoutSeconds is the timeout for driver identification.
        type: integer
      match_enabled:
        description: MatchEnabled enables or disables driver matching.
        type: boolean
    required:
      - action
      - card_number
    type: object
  dto.CloseStreamDTO:
    properties:
      cam:
        type: string
    required:
      - cam
    type: object
  dto.ConfigAudioDTO:
    properties:
      enabled:
        type: boolean
      globalVolume:
        type: number
    type: object
  dto.ConfigAudioEventDTO:
    properties:
      action:
        type: string
      assetId:
        type: string
      assetType:
        type: string
      checksum:
        type: string
      eventEnabled:
        type: boolean
      eventName:
        type: string
      folderName:
        type: string
      isPriority:
        type: boolean
      packageName:
        type: string
      soundEnabled:
        type: boolean
      tenant:
        type: string
      voiceEnabled:
        type: boolean
      volume:
        type: integer
    type: object
  dto.CreateOrderDTO:
    properties:
      orders:
        description: |-
          Orders is an array of individual order requests to be created.
          Each order in the array will be processed independently.
        items:
          $ref: "#/definitions/dto.OrderDTO"
        type: array
    required:
      - orders
    type: object
  dto.DataPlanConfigDTO:
    properties:
      block_reason:
        description: Reason for blocking the data plan. Required if IsBlocked is true,
          must be empty if IsBlocked is false.
        type: string
      cycle_day:
        description: Cycle day of the month when the data plan resets (1-31). Optional,
          defaults to 0 (no cycle).
        type: integer
      is_blocked:
        description: Indicates whether the data plan is currently blocked. Optional,
          defaults to false.
        type: boolean
      total_mb:
        description: Total data plan in megabytes to be applied to the device
        type: integer
    type: object
  dto.DeleteWifiDTO:
    properties:
      ssid:
        description: SSID of the WiFi network to delete
        type: string
    type: object
  dto.DeviceStateDTO:
    type: object
  dto.FirmwareUpdateDTO:
    properties:
      is_debug:
        description: Indicates if the firmware update is a debug version
        type: boolean
      version:
        description: Version of the firmware update
        type: string
    type: object
  dto.OpenStreamDTO:
    properties:
      cam:
        type: string
      domain_endpoint:
        type: string
      port:
        type: string
      protocol:
        type: string
      timeout_seconds:
        type: string
    required:
      - cam
      - protocol
    type: object
  dto.OrderDTO:
    properties:
      correlation_id:
        description: |-
          CorrelationID is an optional unique identifier for request tracking.
          If not provided, it will be auto-generated.
        maxLength: 50
        minLength: 3
        type: string
      parameters:
        description: |-
          Parameters contains the specific data needed for the order type.
          The structure of each parameter depends on the order type.
          For example, ADD_WIFI parameters would contain ssid and password...
        items:
          oneOf:
            - $ref: "#/definitions/dto.AddWifiDTO"
              title: AddWifi
            - $ref: "#/definitions/dto.DeleteWifiDTO"
              title: DeleteWifi
            - $ref: "#/definitions/dto.DeviceStateDTO"
              title: DeviceState
            - $ref: "#/definitions/dto.RequestImageDTO"
              title: RequestImage
            - $ref: "#/definitions/dto.RequestVideoDTO"
              title: RequestVideo
            - $ref: "#/definitions/dto.RebootDTO"
              title: Reboot
            - $ref: "#/definitions/dto.PeriodicDTO"
              title: Periodic
            - $ref: "#/definitions/dto.VisionConfigDTO"
              title: VisionConfig
            - $ref: "#/definitions/dto.DataPlanConfigDTO"
              title: DataPlanConfig
            - $ref: "#/definitions/dto.OpenStreamDTO"
              title: OpenStream
            - $ref: "#/definitions/dto.CloseStreamDTO"
              title: CloseStream
            - $ref: "#/definitions/dto.ConfigAudioDTO"
              title: ConfigAudio
            - $ref: "#/definitions/dto.ConfigAudioEventDTO"
              title: ConfigAudioEvent
            - $ref: "#/definitions/dto.CardDriverDTO"
              title: CardDriver
            - $ref: "#/definitions/dto.FirmwareUpdateDTO"
              title: FirmwareUpdate
        type: array
      type:
        allOf:
          - $ref: "#/definitions/model.OrderType"
        description: Type specifies the kind of order being requested.
    required:
      - parameters
      - type
    type: object
  dto.PeriodicDTO:
    properties:
      off_message_periodic_seconds:
        description: Turns off periodic messages for **seconds**
        type: integer
      on_message_first_seconds:
        description: Sends the first message after **seconds**
        type: integer
      on_message_period_seconds:
        description: Sends messages every **seconds**
        type: integer
    type: object
  dto.RebootDTO:
    type: object
  dto.RequestImageDTO:
    properties:
      cam:
        description: "Camera to be used for image capture **Ex: (0 = DriverCam, 1 =
          RoadCam)**"
        type: string
      start:
        description: 'Start of the time range for image capture in **RFC3339 format Ex:
          "2006-01-02T15:04:05Z07:00"**'
        type: string
    required:
      - cam
    type: object
  dto.RequestVideoDTO:
    properties:
      cam:
        description: "Camera to be used for video capture **Ex: (0 = DriverCam, 1 =
          RoadCam)**"
        type: string
      end:
        description: 'End of the time range for video capture in **RFC3339 format Ex:
          "2006-01-02T15:04:05Z07:00"**'
        type: string
      start:
        description: 'Start of the time range for video capture in **RFC3339 format Ex:
          "2006-01-02T15:04:05Z07:00"**'
        type: string
    required:
      - cam
    type: object
  dto.VisionConfigDTO:
    properties:
      active_face_detect:
        description: Enables or disables face detection
        type: boolean
    type: object
  mapper.OrderRefLink:
    properties:
      href:
        type: string
      rel:
        type: string
    type: object
  mapper.OrderResponse:
    properties:
      correlationId:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      deviceId:
        type: string
      group:
        type: string
      id:
        type: string
      sourceCreatedAt:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  mapper.OrderSuccessAccepted:
    properties:
      orders:
        items:
          $ref: "#/definitions/mapper.SuccessAccepted"
        type: array
    type: object
  mapper.SuccessAccepted:
    properties:
      correlation_id:
        description: CorrelationID of the order
        type: string
      id:
        description: ID of the order
        type: string
      links:
        description: Href to the order resource avaiable to be accessed e.g.
          https://golfleet.v3sandbox.com/v1/devices/{device_id}/orders/{order_id}
        items:
          $ref: "#/definitions/mapper.OrderRefLink"
        type: array
      status:
        description: Status of the order (PENDING, DELETED, FAILED, SENT, PROCESSEDED)
        type: string
    type: object
  model.OrderType:
    enum:
      - ADD_WIFI
      - CONFIG_AUDIO
      - CONFIG_AUDIO_EVENT
      - DELETE_WIFI
      - DEVICE_STATE
      - REQUEST_IMAGE
      - REQUEST_VIDEO
      - CONFIG
      - REBOOT
      - INTERNAL
      - VISION_CONFIG
      - PERIODIC
      - DATAPLAN_CONFIG
      - OPEN_STREAM
      - CLOSE_STREAM
      - CAM_BEHAVIOR
      - CARD_DRIVER
      - FIRMWARE_UPDATE
    type: string
    x-enum-varnames:
      - ADD_WIFI
      - CONFIG_AUDIO
      - CONFIG_AUDIO_EVENT
      - DELETE_WIFI
      - DEVICE_STATE
      - REQUEST_IMAGE
      - REQUEST_VIDEO
      - ORDER_CONFIG
      - REBOOT
      - INTERNAL
      - VISION_CONFIG
      - PERIODIC
      - DATAPLAN_CONFIG
      - OPEN_STREAM
      - CLOSE_STREAM
      - CAM_BEHAVIOR
      - CARD_DRIVER
      - FIRMWARE_UPDATE
  types.Source:
    properties:
      pointer:
        type: string
    type: object
  types.ValidationError:
    properties:
      code:
        description: Error code
        type: string
      detail:
        description: Human-readable error description
        type: string
      source:
        allOf:
          - $ref: "#/definitions/types.Source"
        description: Source of the error, e.g. the field that caused the error
      status:
        description: HTTP status code
        type: integer
      title:
        description: Human-readable error title
        type: string
    type: object
host: tenant.v3sandbox.com
info:
  contact: {}
  description: Aplicação em GO responsável por realizar a gestão de ordens para os
    dispositivos.
  title: Orders API
  version: 0.0.1
paths:
  "/devices/{device_id}/orders":
    get:
      consumes:
        - application/json
      description: Retrieve a list of orders with optional filtering by device_id and
        correlation_id. Supports pagination.
      parameters:
        - description: Device ID
          in: path
          name: device_id
          required: true
          type: string
        - description: "Page number (default: 1)"
          in: query
          name: page
          type: integer
        - description: "Page size (default: 10, max: 100)"
          in: query
          name: page_size
          type: integer
        - description: Filter by correlation ID
          in: query
          name: correlation_id
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Orders retrieved successfully
          schema:
            items:
              $ref: "#/definitions/mapper.OrderResponse"
            type: array
        "400":
          description: Invalid request payload
          schema:
            $ref: "#/definitions/types.ValidationError"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/types.ValidationError"
      summary: Find orders with optional filtering
      tags:
        - Order
      operationId: find-orders-with-optional-filtering
  "/v1/devices/{device_id}/orders":
    delete:
      consumes:
        - application/json
      description: >-
        Deletes multiple orders for a specific device.

        If the `ids` query parameter is provided, only the specified orders will be deleted.

        If omitted, all orders associated with the device may be removed (depending on implementation rules).
      parameters:
        - description: Unique identifier of the device
          in: path
          name: device_id
          required: true
          type: string
        - description: Comma-separated list of order IDs to delete **(e.g. id1,id2,id3)**
          in: query
          name: ids
          type: string
      produces:
        - application/json
      responses:
        "202":
          description: Order sended to deleted
          schema:
            $ref: "#/definitions/mapper.OrderSuccessAccepted"
        "400":
          description: Invalid request payload
          schema:
            $ref: "#/definitions/types.ValidationError"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/types.ValidationError"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/types.ValidationError"
      summary: Delete multiple orders
      tags:
        - Order
      operationId: delete-multiple-orders
    post:
      consumes:
        - application/json
      description: >-
        Submits a list of commands to be executed by the specified device.

        Each command in the list can be one of several supported types, such as:

        (**AddWifi**, **DeleteWifi**, **DeviceState**, **RequestImage**, **RequestVideo**, **Reboot**,

        **Periodic**, **VisionConfig**, **DataPlanConfig**, **ConfigAudio**, **ConfigAudioEvent**).
      parameters:
        - description: ULID do Device
          in: path
          name: device_id
          required: true
          type: string
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CreateOrderDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.OrderDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.AddWifiDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.DeleteWifiDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.DeviceStateDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.RequestImageDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.RequestVideoDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.RebootDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.PeriodicDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.VisionConfigDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.DataPlanConfigDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.ConfigAudioDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.ConfigAudioEventDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.OpenStreamDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CloseStreamDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CamBehaviorDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CardDriverDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.FirmwareUpdateDTO"
      produces:
        - application/json
      responses:
        "202":
          description: Order sended to created
          schema:
            $ref: "#/definitions/mapper.OrderSuccessAccepted"
        "400":
          description: Invalid request payload
          schema:
            $ref: "#/definitions/types.ValidationError"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/types.ValidationError"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/types.ValidationError"
      security:
        - ApiKeyAuth: []
      summary: Create new order
      tags:
        - Order
      operationId: create-new-order
  "/v1/devices/{device_id}/orders/{id}":
    delete:
      consumes:
        - application/json
      description: |-
        Deletes a single order identified by its ID for a given device.
        This operation is irreversible and will permanently remove the order.
      parameters:
        - description: Device ID
          in: path
          name: device_id
          required: true
          type: string
        - description: Order ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "202":
          description: Order sended to deleted
          schema:
            $ref: "#/definitions/mapper.OrderSuccessAccepted"
        "400":
          description: Invalid request payload
          schema:
            $ref: "#/definitions/types.ValidationError"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/types.ValidationError"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/types.ValidationError"
      summary: Delete a specific order
      tags:
        - Order
      operationId: delete-a-specific-order
    get:
      consumes:
        - application/json
      description: Retrieve an order by its ID for a specific device
      parameters:
        - description: Device ID
          in: path
          name: device_id
          required: true
          type: string
        - description: Order ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Order retrieved successfully
          schema:
            $ref: "#/definitions/mapper.OrderResponse"
        "400":
          description: Invalid request payload
          schema:
            $ref: "#/definitions/types.ValidationError"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/types.ValidationError"
        "404":
          description: Order not found
          schema:
            $ref: "#/definitions/types.ValidationError"
      summary: Get a specific order
      tags:
        - Order
      operationId: get-a-specific-order
  "/v1/fleets/{fleet_id}/orders":
    post:
      consumes:
        - application/json
      description: >-
        Submits a list of commands to be executed by the specified device on
        behalf of a fleet.

        Each command in the list can be one of several supported types, such as:

        (**AddWifi**, **DeleteWifi**, **DeviceState**, **RequestImage**, **RequestVideo**, **Reboot**,

        **Periodic**, **VisionConfig**, **DataPlanConfig**, **ConfigAudio**, **ConfigAudioEvent**).
      parameters:
        - description: ULID do Fleet
          in: path
          name: fleet_id
          required: true
          type: string
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CreateOrderDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.OrderDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.AddWifiDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.DeleteWifiDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.DeviceStateDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.RequestImageDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.RequestVideoDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.RebootDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.PeriodicDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.VisionConfigDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.DataPlanConfigDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.ConfigAudioDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.ConfigAudioEventDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.OpenStreamDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CloseStreamDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CamBehaviorDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.CardDriverDTO"
        - description: Create Order payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/dto.FirmwareUpdateDTO"
      produces:
        - application/json
      responses:
        "202":
          description: Order sended to created
          schema:
            $ref: "#/definitions/mapper.OrderSuccessAccepted"
        "400":
          description: Invalid request payload
          schema:
            $ref: "#/definitions/types.ValidationError"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/types.ValidationError"
        "500":
          description: Internal server error
          schema:
            $ref: "#/definitions/types.ValidationError"
      security:
        - ApiKeyAuth: []
      summary: Create new order by fleet
      tags:
        - Order
      operationId: create-new-order-by-fleet
schemes:
  - https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Bearer Token
    type: apiKey
swagger: "2.0"
