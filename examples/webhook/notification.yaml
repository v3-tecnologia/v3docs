basePath: /
definitions:
  main.EventResponse:
    properties:
      message:
        type: string
    type: object
  main.WebhookPayload:
    properties:
      id:
        type: string
        description: ULID do Webhook
      created_at:
        type: string
        format: date-time
        description: Data de criação do Webhook
      attributes:
        type: array
        items:
          oneOf:
          - $ref: '#/definitions/model.OrderStatus'
            title: Order
          - $ref: '#/definitions/model.Event'
            title: Event
        description: Atributos do Webhook
    type: object
  model.OrderStatus:
    properties:
      id:
        type: string
        value: "ORDER"
        description: ULID do Evento
      created_at:
        type: string
        format: date-time
        description: Data de criação do Evento
      type:
        type: string
        description: Tipo do Evento
      sub:
        type: string
        value: "STATUS"
        description: Subtipo do Evento
      attributes:
        items:
          type: array
          properties:
            device:
              $ref: '#/definitions/model.Device'
              description: Dispositivo associado ao Evento
              type: object
            order:
              $ref: '#/definitions/model.Order'
              description: Order associada ao Evento
              type: object
        description: Atributos da Order Status
    type: object
  model.Event:
    properties:
      id:
        type: string
        description: ULID do Evento
      created_at:
        type: string
        format: date-time
        description: Data de criação do Evento no Firmeware
      type:
        type: string
        description: Tipo do Evento
      sub:
        type: string
        description: Subtipo do Evento
      attributes:
        items:
          type: array
          properties:
            device:
              $ref: '#/definitions/model.Device'
              description: Dispositivo associado ao Evento
            order:
              $ref: '#/definitions/model.OrderSummary'
              description: Order associada ao Evento
            files:
              items:
                $ref: '#/definitions/model.File'
              type: array
              description: Lista de arquivos associados ao Evento
    type: object
  model.Device:
    properties:
      id:
        type: string
        description: ULID do dispositivo na API
      correlation_id:
        type: string
        format: ulid
        description: ULID de correlação do Dispositivo
      imei:
        type: string
        description: IMEI do Dispositivo
    type: object
  model.Order:
    properties:
      id:
        type: string
        description: ULID da Order
      correlation_id:
        type: string
        format: ulid
        description: ULID de correlação da Order
      group:
        type: string
        description: Grupo da Order
      status:
        type: enum
        enum:
          - "DELETED"
          - "PROCESSED"
          - "FAILED"
          - "SENT"
          - "PENDING"
          - "NACK"
          - "ACK"
        x-enum-varnames:
          - "DELETED"
          - "PROCESSED"
          - "FAILED"
          - "SENT"
          - "PENDING"
          - "NACK"
          - "ACK"
        description: Status da Order
      type:
        type: enum
        enum:
          - "ADD_WIFI"
          - "DELETE_WIFI"
          - "DEVICE_STATE"
          - "REQUEST_IMAGE"
          - "REQUEST_VIDEO"
          - "CONFIG"
          - "REBOOT"
          - "DRIVER_COACH_INERTIAL"
          - "DRIVER_COACH_TELEMETRY"
          - "DRIVER_COACH_TRACKING"
          - "INTERNAL"
        x-enum-varnames:
          - "ADD_WIFI"
          - "DELETE_WIFI"
          - "DEVICE_STATE"
          - "REQUEST_IMAGE"
          - "REQUEST_VIDEO"
          - "CONFIG"
          - "REBOOT"
          - "DRIVER_COACH_INERTIAL"
          - "DRIVER_COACH_TELEMETRY"
          - "DRIVER_COACH_TRACKING"
          - "INTERNAL"
        description: Tipo de Order
      created_at:
        type: string
        format: date-time
        description: Data de criação da Order
      updated_at:
        type: string
        format: date-time
        description: Data da última atualização da Order
      deleted_at:
        type: string
        format: date-time
        description: Data de exclusão da Order
    type: object
  model.OrderSummary:
    properties:
      id:
        type: string
        description: ULID da Order
      correlation_id:
        type: string
        format: ulid
        description: ULID de correlação da Order
      created_at:
        type: string
        format: date-time
        description: Data de criação da Order
      updated_at:
        type: string
        format: date-time
        description: Data da última atualização da Order
      deleted_at:
        type: string
        format: date-time
        description: Data de exclusão da Order
    type: object
  model.File:
    properties:
      id:
        type: string
        description: ULID da Mídia
      url:
        type: string
        description: URL da Mídia
      metadata:
        $ref: '#/definitions/model.FileMetadata'
        description: Metadados da Mídia
    type: array
  model.FileMetadata:
    properties:
      width:
        type: integer
        description: Largura da mídia em pixels
      height:
        type: integer
        description: Altura da mídia em pixels
      compression:
        type: string
        description: Tipo de compressão da mídia
      quality:
        type: integer
        description: Qualidade da mídia (0-100)
      cam_channel:
        type: string
        description: Canal da câmera
      content_type:
        type: string
        description: Tipo de conteúdo da mídia (MIME)
      file_size:
        type: integer
        description: Tamanho do arquivo em bytes
    type: object
host: yourcompany.com
info:
  contact: {}
  description: That is a webhook service for notifications.
  title: notification-service
  version: 0.0.1
paths:
  /webhook:
    post:
      consumes:
      - application/json
      parameters:
      - name: X-V3-Signature
        in: header
        description: HMAC Header to validate
        required: true
        schema:
          type: string
      - description: Webhook Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.WebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Event message received!
          schema:
            $ref: '#/definitions/main.EventResponse'
        "500":
          description: Internal Server Error
          schema: {}
      summary: Webhook
      tags:
      - Webhook
schemes:
- https
swagger: "2.0"
